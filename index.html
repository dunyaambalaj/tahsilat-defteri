      </div>
      <p class="meta" style="margin-top:8px">Defter listesi yönetici şifrenizle <b>şifrelenerek</b> saklanır; çalışanlar diğer defterlerin bağlantısını göremez. Tüm defterlerde aynı yönetici şifresi geçerlidir.</p>`;
    host.querySelectorAll("[data-lopen]").forEach(b => b.onclick = () => openLedger(b.dataset.lopen));
    host.querySelectorAll("[data-lren]").forEach(b => b.onclick = async () => {
      const L = g.list.find(x => x.id === b.dataset.lren); const ad = prompt("Defter adı:", L.ad); if (!ad || !ad.trim()) return;
      try { await renameLedger(L.id, ad.trim()); toast("Ad değiştirildi"); renderAdminPanel(); } catch (e) { toast("Değiştirilemedi: " + fbErr(e)); }
    });
    host.querySelectorAll("[data-ldel]").forEach(b => b.onclick = async () => {
      const L = g.list.find(x => x.id === b.dataset.ldel);
      if (!confirm(`“${L.ad}” listeden çıkarılsın mı? Defterin kendisi silinmez; yalnızca bu listeden kalkar.`)) return;
      try { await removeFromGroup(L.id); toast("Listeden çıkarıldı"); renderLedgers(host); } catch (e) { toast("Çıkarılamadı: " + fbErr(e)); }
    });
    document.getElementById("lNew").onclick = async () => {
      const ad = prompt("Yeni defterin adı (örn. Şube 2):"); if (!ad || !ad.trim()) return;
      try { const r = await addNewLedger(ad.trim()); toast(r.fails.length ? "Oluşturuldu; kasa güncellenemedi: " + r.fails.join(", ") : "Defter oluşturuldu"); if (confirm(`“${ad.trim()}” defterine şimdi geçilsin mi?`)) openLedger(r.id); else renderLedgers(host); }
      catch (e) { toast("Oluşturulamadı: " + (e.message || fbErr(e))); }
    };
    document.getElementById("lAdd").onclick = async () => {
      const link = prompt("Eklenecek defterin bağlantısını yapıştırın.\nNot: o defterin yönetici şifresi, sizinkiyle aynı yapılacaktır."); if (!link) return;
      try { const r = await addExistingLedger(link); toast("Eklendi: " + r.ad); renderLedgers(host); }
      catch (e) { toast("Eklenemedi: " + (e.message || fbErr(e))); }
    };
  }
  function renderAdminPanel() {
    adminTouch();
    const owner = (() => { try { return localStorage.getItem("kirtasiye_sahip_" + DEFTER_ID) === "1"; } catch (e) { return false; } })();
    openSheet(`
      <div class="sheet-card full admin">
        <div class="grab"></div>
        <div style="display:flex;align-items:center;gap:8px">
          <h2 style="flex:1;font-size:18px">🛡 Yönetici paneli</h2>
          <button class="btn btn-ghost" id="admLock">Kilitle</button>
          <button class="btn btn-ghost" id="sheetClose">Kapat</button>
        </div>
        <p class="meta" style="margin:6px 2px 0">Yalnızca yönetici şifresini bilen kişi buraya girebilir. Oturum 10 dakika açık kalır.</p>

        <label class="fld">Defterlerim (çoklu defter)</label>
        <div id="ledgerHost"></div>

        <label class="fld">Firma bilgileri</label>
        <input class="inp" id="sAd" value="${esc(db.magaza)}" placeholder="Firma adı / unvan" />
        <div class="row2">
          <div><label class="fld">Telefon</label><input class="inp" id="sTel" inputmode="tel" value="${esc(db.firma.tel)}" placeholder="05xx" /></div>
          <div><label class="fld">Vergi no</label><input class="inp" id="sVergi" value="${esc(db.firma.vergi)}" placeholder="İsteğe bağlı" /></div>
        </div>
        <label class="fld">Adres</label>
        <textarea class="inp" id="sAdres" rows="2" placeholder="Fiş ve paylaşımlarda görünür">${esc(db.firma.adres)}</textarea>
        <label class="fld">Logo</label>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="brand-mark" style="border-color:var(--line);background:var(--badge);color:var(--mute);width:48px;height:48px;overflow:hidden;flex:0 0 48px">${db.firma.logo ? `<img src="${db.firma.logo}" style="width:100%;height:100%;object-fit:cover">` : icon("book")}</div>
          <button class="btn btn-gold" id="sLogoBtn" style="flex:1">Logo yükle</button>
          <button class="btn btn-ghost" id="sLogoDel" ${db.firma.logo ? "" : "disabled"}>Kaldır</button>
        </div>
        <input type="file" id="sLogoFile" accept="image/*" class="hidden" />
        <button class="btn btn-leather" id="sSave" style="width:100%;margin-top:12px">Firma bilgilerini kaydet</button>

        <label class="fld">Tahsilat ayarları</label>
        <button class="btn btn-ghost" id="sGoal" style="width:100%">🎯 Aylık tahsilat hedefi: ${db.hedef ? fmtK(db.hedef) : "tanımlı değil"}</button>
        <button class="btn btn-ghost" id="sMesai" style="width:100%;margin-top:8px">🕘 Mesai saatleri: ${mesaiOn() ? mesaiOzet() : "tanımlı değil"}</button>
        <button class="btn btn-ghost" id="sTpl" style="width:100%;margin-top:8px">💬 WhatsApp mesaj şablonları (${tpls().length})</button>
        <button class="btn ${db.otoErt === false ? "btn-ghost" : "btn-leather"}" id="aOto" style="width:100%;margin-top:8px">↻ Otomatik erteleme: ${db.otoErt === false ? "Kapalı" : "Açık"}</button>

        <label class="fld">Erişim ve güvenlik</label>
        <div data-devhost></div>
        <button class="btn btn-ghost" id="aRenew" style="width:100%;margin-top:8px">🔒 Bağlantıyı yenile (eskisini kapat)</button>
        <button class="btn btn-gold" id="aPw" style="width:100%;margin-top:8px">🔑 Yönetici şifresini değiştir</button>
        ${owner ? `<button class="btn btn-ghost" id="aPwReset" style="width:100%;margin-top:8px;color:var(--red)">Şifreyi sıfırla (bu cihaz defteri oluşturdu)</button>` : ""}

        <label class="fld">Silinenler ve yedek</label>
        <button class="btn btn-ghost" id="sTrash" style="width:100%">🗑 Silinenler kutusu (${db.kayitlar.filter(k => k.silindi).length})</button>
        <div class="g2" style="margin-top:8px">
          <button class="btn btn-gold" id="sExp">${icon("fileDown")} JSON indir</button>
          <button class="btn btn-ghost" id="sImp">${icon("fileUp")} JSON yükle</button>
        </div>
        <div class="g2" style="margin-top:8px">
          <button class="btn btn-leather" id="sCsv">${icon("fileDown")} CSV indir</button>
          <button class="btn btn-ghost" id="sCsvImp">${icon("fileUp")} CSV yükle</button>
        </div>
        <input type="file" id="sFile" accept="application/json" class="hidden" />
        <input type="file" id="sCsvFile" accept=".csv,text/csv" class="hidden" />

        <label class="fld" style="color:var(--red)">Tehlikeli bölge</label>
        <button class="btn btn-ghost" id="sWipe" style="width:100%;color:#8b2e2e">Tüm defteri sil</button>
      </div>`, true);
    const $ = id => document.getElementById(id);
    $("sheetClose").onclick = closeSheet;
    $("admLock").onclick = () => { adminUntil = 0; adminPw = null; closeSheet(); toast("Yönetici paneli kilitlendi"); };
    renderLedgers($("ledgerHost"));
    $("sSave").onclick = () => {
      db.magaza = $("sAd").value.trim() || db.magaza;
      db.firma.tel = $("sTel").value.trim(); db.firma.vergi = $("sVergi").value.trim(); db.firma.adres = $("sAdres").value.trim();
      save(); closeSheet(); render(); toast("Ayarlar kaydedildi");
    };
    $("sLogoBtn").onclick = () => $("sLogoFile").click();
    $("sLogoFile").onchange = e => { const f = e.target.files?.[0]; if (f) processLogo(f); };
    $("sLogoDel").onclick = () => { db.firma.logo = ""; save(); render(); renderAdminPanel(); toast("Logo kaldırıldı"); };
    $("sGoal").onclick = openGoalSheet; $("sMesai").onclick = openMesaiSheet; $("sTpl").onclick = openTplManager;
    $("aOto").onclick = () => { db.otoErt = db.otoErt === false ? true : false; save(); if (db.otoErt) scheduleRollover(600); renderAdminPanel(); toast("Otomatik erteleme " + (db.otoErt ? "açık" : "kapalı")); };
    repaintDevices();
    $("aRenew").onclick = renewLink;
    $("aPw").onclick = changeAdminPassword;
    const pr = $("aPwReset");
    if (pr) pr.onclick = async () => {
      const t = prompt("Yönetici şifresi kaldırılacak; ardından yenisini belirleyebilirsiniz.\nDiğer defterlerin kasası da sıfırlanır.\nDevam için büyük harfle SIFIRLA yazın:");
      if (!t || t.trim().toUpperCase().replace("İ", "I") !== "SIFIRLA") return toast("Vazgeçildi");
      db.silmePin = null; adminPw = null; adminUntil = 0; save();
      if (cloudOn && hasSubtle()) { try { await fbm.deleteDoc(dRef(DEFTER_ID, "ayar", "kasa")); } catch (e) {} vaultRaw = null; }
      closeSheet(); toast("Şifre sıfırlandı. Yönetici panelinden yeni şifre belirleyin.");
    };
    $("sTrash").onclick = openTrash;
    $("sExp").onclick = exportJSON; $("sImp").onclick = () => $("sFile").click(); $("sFile").onchange = importJSON;
    $("sCsv").onclick = exportCSV; $("sCsvImp").onclick = () => $("sCsvFile").click();
    $("sCsvFile").onchange = e => { const f = e.target.files?.[0]; if (f) importCSV(f); };
    $("sWipe").onclick = wipeAll;
  }

  /* ---- Bildirim merkezi: eklenen, tahsil edilen, silinen, düzenlenen, ertelenen, geri getirilen — hepsi ---- */
  const ACT_KIND = { olusturuldu: "ekle", tahsil: "tahsil", kismi: "tahsil", silindi: "sil", duzenlendi: "duzenle", ertelendi: "ertele", geri: "geri" };
  const KIND_AD = { ekle: "Eklenen", tahsil: "Tahsil edilen", sil: "Silinen", duzenle: "Düzenlenen", ertele: "Ertelenen", geri: "Geri getirilen" };
  const SEEN_KEY = "kirtasiye_bildirim_son";
  const btPref = k => !(db.ayar.bt && db.ayar.bt[k] === false);
  function lastSeen() {
    try { let v = localStorage.getItem(SEEN_KEY); if (!v) { v = new Date().toISOString(); localStorage.setItem(SEEN_KEY, v); } return v; } catch (e) { return ""; }
  }
  const markSeen = () => { try { localStorage.setItem(SEEN_KEY, new Date().toISOString()); } catch (e) {} };
  const evMine = e => { const me = ME(); return !!me && e.kim === me; };
  function unreadCount() {
    const ls = lastSeen(); let n = 0;
    for (const e of activityEvents()) { if (String(e.t) <= ls) break; if (!evMine(e) && btPref(ACT_KIND[e.a] || "")) n++; }
    return n;
  }
  function noteList(old, rec) {
    const oldN = old ? (old.gecmis || []).length : 0, added = (rec.gecmis || []).slice(oldN), out = [], nm = rec.musteri;
    added.forEach(g => {
      const kim = g.k || rec.sonKim || "Biri", kind = ACT_KIND[g.a]; if (!kind) return;
      let m = null;
      switch (g.a) {
        case "olusturuldu": m = `${kim} yeni tahsilat ekledi: ${nm} · ${fmtTRY(rec.tutar)}`; break;
        case "tahsil": m = `${kim} tahsil etti: ${nm} · ${g.tutar ? fmtTRY(g.tutar) : (g.d || "")}`; break;
        case "kismi": m = `${kim} kısmi tahsilat girdi: ${nm} · ${g.tutar ? fmtTRY(g.tutar) : (g.d || "")}`; break;
        case "ertelendi": m = kim === "Sistem" ? `Sistem otomatik erteledi: ${nm} → ${fmtDate(rec.vade)}` : `${kim} erteledi: ${nm} → ${fmtDate(rec.vade)}`; break;
        case "duzenlendi": m = `${kim} kaydı düzenledi: ${nm}`; break;
        case "silindi": m = `${kim} tahsilatı sildi: ${nm} · ${fmtTRY(rec.tutar)}`; break;
        case "geri": m = `${kim} silinen kaydı geri getirdi: ${nm}`; break;
      }
      if (m && btPref(kind)) out.push(m);
    });
    if (!added.length) { /* gecmişsiz değişiklik (eski sürüm istemcisi) */
      const m = describeChange(old, rec);
      const kind = !old ? "ekle" : (rec.silindi && !old.silindi) ? "sil" : (!rec.silindi && old.silindi) ? "geri" : "duzenle";
      if (m && btPref(kind)) out.push(m);
    }
    return out;
  }
  function pushNotes(old, rec) { if (isMine(rec)) return; noteList(old, rec).forEach(m => remoteNotes.push(m)); }
  let ncFilter = "hepsi";
  function openNotifCenter() {
    const prev = lastSeen(); markSeen(); setTimeout(() => { try { render(); } catch (e) {} }, 0);
    const all = activityEvents(), today = todayISO();
    const list = all.filter(e => ncFilter === "hepsi" || ACT_KIND[e.a] === ncFilter).slice(0, 200);
    const cnt = k => all.filter(e => ACT_KIND[e.a] === k).length;
    const d = digest(), nRem = d.ert.length + d.gec.length + d.bug.length + d.yarin.length;
    const groups = [];
    list.forEach(e => { const dd = dayOf(e.t), g = groups[groups.length - 1]; if (g && g.d === dd) g.items.push(e); else groups.push({ d: dd, items: [e] }); });
    openSheet(`
      <div class="sheet-card full">
        <div class="grab"></div>
        <div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1;font-size:18px">Bildirimler</h2><button class="btn btn-ghost" id="sheetClose">Kapat</button></div>
        <button class="btn btn-ghost" id="ncRem" style="width:100%;margin-top:10px">🔔 Hatırlatmalar · ${nRem}</button>
        <div class="chips nc-chips" style="margin:10px 0 4px">
          <button class="chip ${ncFilter === "hepsi" ? "on" : ""}" data-ncf="hepsi">Tümü ${all.length}</button>
          ${Object.keys(KIND_AD).map(k => `<button class="chip ${ncFilter === k ? "on" : ""}" data-ncf="${k}">${KIND_AD[k]} ${cnt(k)}</button>`).join("")}
        </div>
        ${groups.length ? groups.map(g => `
          <div class="day-h"><b class="${g.d === today ? "today" : ""}">${g.d === today ? "Bugün" : g.d === addDays(today, -1) ? "Dün" : fmtLong(g.d)}</b><span>${g.items.length} bildirim</span></div>
          <div class="group">${g.items.map(e => { const un = String(e.t) > prev && !evMine(e); return actRow(e, false).replace('class="row"', `class="row${un ? " unread" : ""}"`); }).join("")}</div>`).join("")
          : `<div class="empty">Bu türde bildirim yok.</div>`}
      </div>`, true);
    document.getElementById("sheetClose").onclick = closeSheet;
    document.getElementById("ncRem").onclick = () => openDigest(true);
    document.querySelectorAll("[data-ncf]").forEach(b => b.onclick = () => { ncFilter = b.dataset.ncf; openNotifCenter(); });
    document.querySelectorAll("#sheet .row[data-open]").forEach(r => r.onclick = () => { const k = kayitlar().find(x => x.id === r.dataset.open); if (k) openDetail(k); });
  }

  /* ---------- BAŞLAT ---------- */
  applyTheme();
  if (cloudReady() && !DEFTER_ID) {
    welcomeStart();
  } else {
    render();
    if (db.pin) showLock();
    else setTimeout(maybeAutoDigest, 500);
    if (!DEFTER_ID) scheduleRollover(1500);
    if (DEFTER_ID) {
      /* Adres çubuğunda kod kalsın: "Ana ekrana ekle" yapılınca defter bağlantısı korunur */
      if (!location.hash.includes(DEFTER_ID)) history.replaceState(null, "", location.pathname + location.search + "#d=" + DEFTER_ID);
      startCloud();
      let tries = 0;
      const askName = setInterval(() => {
        if (ME() || ++tries > 12) return clearInterval(askName);
        if (!document.getElementById("sheet").classList.contains("show")) openNameSheet(true);
      }, 2500);
      try {
        if (localStorage.getItem("kirtasiye_ilk_baglanti") === "1") {
          localStorage.removeItem("kirtasiye_ilk_baglanti");
          setTimeout(openStatusSheet, 900);
        }
      } catch (e) {}
    }
  }

  /* Eski sürümden kalan servis çalışanı/önbellek bir kez temizlenir, sonra yenisi kaydedilir */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", async () => {
      try {
        if (localStorage.getItem("kirtasiye_build") !== BUILD) {
          localStorage.setItem("kirtasiye_build", BUILD);
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
          if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
        }
      } catch (e) {}
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
  </script>
</body>
</html>
