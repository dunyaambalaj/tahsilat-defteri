  /* ---------- CSV ---------- */
  function csvCell(v) {
    v = String(v ?? "");
    return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function exportCSV() {
    const head = ["Musteri","Tutar","TahsilEdilen","Kalan","OdemeTuru","KayitTipi","Vade","KayitTarihi","TahsilTarihi","Durum","ErtelemeSayisi","BelgeNo","Telefon","Not"];
    const stT = { tahsil:"TAHSIL", bekliyor:"BEKLIYOR", ertelendi:"ERTELENDI", kismi:"KISMI", iptal:"IPTAL" };
    const lines = [head.join(";")];
    kayitlar().forEach(k => {
      lines.push([
        k.musteri, String(k.tutar).replace(".",","), String(k.tahsilTutar||0).replace(".",","), String(remaining(k)).replace(".",","),
        typeAd(k.tur, k), TK_AD[k.turKayit] || k.turKayit, fmtDate(k.vade), fmtDate(k.kayitTarihi), k.tahsilTarihi ? fmtDate(k.tahsilTarihi) : "",
        stT[statusOf(k)] || "", k.ertelemeSayisi||0, k.belgeNo, k.telefon, k.not
      ].map(csvCell).join(";"));
    });
    const csv = "\uFEFF" + lines.join("\r\n");
    download(`odeme-defteri-${todayISO()}.csv`, new Blob([csv], { type: "text/csv;charset=utf-8" }));
    toast("CSV indirildi");
  }
  function parseCSV(text) {
    const rows = [];
    let row = [], cur = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
        else if (c === '"') inQ = false;
        else cur += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ";") { row.push(cur); cur = ""; }
        else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
        else if (c !== "\r") cur += c;
      }
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function parseDateAny(s) {
    s = String(s || "").trim();
    const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return "";
  }
  function importCSV(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        let txt = String(r.result).replace(/^\uFEFF/, "");
        const rows = parseCSV(txt).filter(x => x.length > 1);
        if (rows.length < 2) throw new Error("boş");
        const head = rows[0].map(h => h.trim().toLowerCase());
        const idx = n => head.indexOf(n);
        const iM = idx("musteri"), iT = idx("tutar");
        if (iM < 0 || iT < 0) throw new Error("başlık");
        pushUndo("CSV içe aktarma");
        let n = 0;
        rows.slice(1).forEach(row => {
          const musteri = (row[iM] || "").trim();
          const tutar = parseMoney(row[iT] || "");
          if (!musteri || tutar <= 0) return;
          const tahsil = parseMoney(row[idx("tahsiledilen")] || "0");
          const turN = (row[idx("odemeturu")] || "").trim();
          const tkN = head.includes("kayittipi") ? (row[idx("kayittipi")] || "").trim() : "";
          const taksitM = turN.match(/Taksit\s*\((\d+)/i);
          const tur = /Taksit/i.test(turN) ? "kart_taksit" : ((TYPES.find(t => t.ad === turN) || {}).id || "nakit");
          const taksitSayisi = taksitM ? parseInt(taksitM[1], 10) : 1;
          const turKayit = Object.keys(TK_AD).find(id => TK_AD[id] === tkN) || "soz";
          const rec = {
            id: uid() + n, musteri, tutar, tur, taksitSayisi, turKayit,
            telefon: (row[idx("telefon")] || "").trim(),
            vade: parseDateAny(row[idx("vade")]) || todayISO(),
            kayitTarihi: parseDateAny(row[idx("kayittarihi")]) || todayISO(),
            tahsilTarihi: parseDateAny(row[idx("tahsiltarihi")]) || "",
            belgeNo: (row[idx("belgeno")] || "").trim(),
            not: (row[idx("not")] || "").trim(),
            tahsilTutar: tahsil,
            durum: tahsil >= tutar ? "tahsil" : "bekliyor",
            ertelemeSayisi: parseInt(row[idx("ertelemeyisi")] || row[idx("ertelemesayisi")] || "0") || 0,
            ertelemeGecmisi: [], gecmis: [{ t: new Date().toISOString(), a: "olusturuldu", d: "CSV içe aktarım" }]
          };
          db.kayitlar.push(rec); n++;
        });
        save(); closeSheet(); render();
        toast(n ? `${n} kayıt içe aktarıldı` : "Aktarılacak kayıt bulunamadı", n ? UNDO : undefined);
      } catch(err) { toast("Geçersiz CSV dosyası"); }
    };
    r.readAsText(file);
  }

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function drawShareImage(title, list, logoImg) {
    const s = sums(list);
    const rows = list.slice(0, 12);
    const W = 1080, rowH = 100, head = 300, foot = 220;
    const H = head + rows.length * rowH + foot;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    const color = (key, fallback) => css.getPropertyValue(key).trim() || fallback;
    const C = {
      ink: color("--ink", "#1a1612"), primary: color("--leather", "#142923"),
      accent: color("--gold", "#c9a227"), paper: color("--paper", "#f3ead8"),
      sheet: color("--sheet", "#fff8ec"), line: color("--line", "#e4d5b8"),
      mute: color("--mute", "#6b5e4a")
    };
    ctx.fillStyle = C.paper; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = C.primary; ctx.fillRect(0,0,W,210);
    ctx.fillStyle = C.accent; ctx.fillRect(0,210,W,6);
    let tx = 64;
    if (logoImg) {
      try {
        ctx.save();
        rr(ctx, 64, 52, 96, 96, 18);
        ctx.fillStyle = "#fff8ec"; ctx.fill();
        ctx.clip();
        ctx.drawImage(logoImg, 64, 52, 96, 96);
        ctx.restore();
        tx = 184;
      } catch(e) { tx = 64; }
    }
    ctx.font = "700 20px sans-serif"; ctx.fillStyle = C.accent;
    ctx.fillText("ÖDEME DEFTERİ", tx, 62);
    ctx.fillStyle = "#fff"; ctx.font = "800 38px sans-serif";
    ctx.fillText(db.magaza.slice(0, 30), tx, 106);
    ctx.font = "600 17px sans-serif"; ctx.fillStyle = "rgba(255,255,255,.76)";
    if (db.firma.tel) ctx.fillText(("Tel: " + db.firma.tel).slice(0, 46), tx, 134);
    ctx.font = "600 26px sans-serif"; ctx.fillStyle = "#fff";
    ctx.fillText(title.slice(0, 50), 64, 182);
    ctx.fillStyle = C.ink; ctx.font = "700 22px sans-serif";
    ctx.fillText("Müşteri · Ödeme türü · Vade", 64, 262);
    ctx.textAlign = "right"; ctx.fillText("Tutar", W-64, 262); ctx.textAlign = "left";
    rows.forEach((k, i) => {
      const y = head + i * rowH;
      ctx.fillStyle = i % 2 ? C.sheet : C.paper;
      rr(ctx, 48, y, W-96, rowH-12, 14); ctx.fill();
      ctx.fillStyle = C.ink; ctx.font = "700 27px sans-serif";
      ctx.fillText((k.musteri || "").slice(0, 28), 72, y + 36);
      const tl = typeAd(k.tur, k);
      ctx.font = "700 19px sans-serif";
      const tw = ctx.measureText(tl).width + 26;
      ctx.fillStyle = C.line; rr(ctx, 72, y + 50, tw, 32, 16); ctx.fill();
      ctx.fillStyle = C.primary; ctx.fillText(tl, 85, y + 73);
      ctx.fillStyle = C.mute; ctx.font = "500 19px sans-serif";
      ctx.fillText(`${statusLabel(statusOf(k))}  ·  Vade ${fmtDate(k.vade)}`, 72 + tw + 14, y + 73);
      ctx.fillStyle = C.ink; ctx.font = "800 26px sans-serif";
      ctx.textAlign = "right"; ctx.fillText(fmtTRY(k.tutar), W-72, y + 40);
      if ((k.tahsilTutar || 0) > 0 && statusOf(k) !== "tahsil") {
        ctx.font = "600 18px sans-serif"; ctx.fillStyle = C.mute;
        ctx.fillText(`Kalan ${fmtTRY(remaining(k))}`, W-72, y + 68);
      }
      ctx.textAlign = "left";
    });
    if (list.length > 12) {
      ctx.fillStyle = C.mute; ctx.font = "600 20px sans-serif";
      ctx.fillText(`ve ${list.length - 12} kayıt daha…`, 64, head + rows.length * rowH + 4);
    }
    const fy = H - 170;
    ctx.fillStyle = C.primary; ctx.fillRect(48, fy, W-96, 120);
    ctx.fillStyle = C.accent; ctx.font = "700 20px sans-serif";
    ctx.fillText("Bekleyen", 80, fy+40); ctx.fillText("Tahsil", 420, fy+40); ctx.fillText("Ertelenen", 760, fy+40);
    ctx.fillStyle = "#fff"; ctx.font = "800 27px sans-serif";
    ctx.fillText(fmtTRY(s.bek), 80, fy+84); ctx.fillText(fmtTRY(s.tah), 420, fy+84); ctx.fillText(fmtTRY(s.ert), 760, fy+84);
    ctx.fillStyle = C.mute; ctx.font = "500 16px sans-serif";
    ctx.fillText("Ortak defter · " + new Date().toLocaleString("tr-TR"), 64, H - 28);
    return c;
  }

  async function loadSdk() {
    let last;
    for (const v of FB_VERSIONS) {
      try {
        const base = `https://www.gstatic.com/firebasejs/${v}/`;
        const [a, au, fs] = await Promise.all([
          import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
        ]);
        diag.sdk = v;
        return { ...a, ...au, ...fs };
      } catch (e) { last = e; console.warn("Firebase SDK yüklenemedi:", v, e); }
    }
    throw last;
  }
  function cloudInit() {
    if (!cloudReady()) return Promise.resolve(false);
    if (fbDb) return Promise.resolve(true);
    if (!fbInitP) {
      fbInitP = (window.__fbLoader || loadSdk)().then(mod => {
        fbm = mod;
        const app = fbm.initializeApp(window.FIREBASE_CONFIG);
        fbAuth = fbm.getAuth(app);
        try {
          /* Çevrimdışı çalışma: işlemler cihazda saklanır, internet gelince otomatik gönderilir */
          fbDb = fbm.initializeFirestore(app, { localCache: fbm.persistentLocalCache({ tabManager: fbm.persistentMultipleTabManager() }) });
        } catch (e) { console.warn(e); fbDb = fbm.getFirestore(app); }
        return true;
      }).catch(err => { console.warn(err); diag.err = "Firebase kodu yüklenemedi (internet / engelleyici?)"; fbInitP = null; return false; });
    }
    return fbInitP;
  }

  const memberApplicationsRef = id => fbm.collection(fbDb, "defterler", id, "uyelikBasvurulari");

    && !!user.emailVerified

  const isLedgerManager = () => isFixedAdmin(fbAuth && fbAuth.currentUser) || ["owner", "admin"].includes(ledgerRole);
  const canAssignAdminRole = () => isFixedAdmin(fbAuth && fbAuth.currentUser) || ledgerRole === "owner";
  const canWriteLedger = () => !DEFTER_ID || ["owner", "admin", "editor"].includes(ledgerRole);
  const canAssignRole = (role, targetRole = "", targetUid = "") => {
    const user = fbAuth && fbAuth.currentUser;
    if (!["admin", "editor", "viewer"].includes(role) || targetUid === (user && user.uid)) return false;
    if (isFixedAdmin(user) || ledgerRole === "owner") return targetRole !== "owner";
    return ledgerRole === "admin"
      && ["editor", "viewer"].includes(role)
      && (!targetRole || ["editor", "viewer"].includes(targetRole));
  };
  const canRemoveMember = (targetRole, targetUid) => {
    const user = fbAuth && fbAuth.currentUser;
    if (targetUid === (user && user.uid) || targetRole === "owner") return false;
    if (isFixedAdmin(user) || ledgerRole === "owner") return true;
    return ledgerRole === "admin" && ["editor", "viewer"].includes(targetRole);
  };
  const roleOptions = (selected = "editor", forAdmin = canAssignAdminRole()) => {
    const roles = forAdmin ? ["admin", "editor", "viewer"] : ["editor", "viewer"];

  async function authenticateGoogle() {
    const ok = await cloudInit();
    if (!ok) throw new Error(diag.err || "Firebase yüklenemedi");
    await fbAuth.authStateReady();
    const provider = new fbm.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      if (fbAuth.currentUser && fbAuth.currentUser.isAnonymous) {
        await fbm.linkWithPopup(fbAuth.currentUser, provider);
      } else if (!fbAuth.currentUser) {
        await fbm.signInWithPopup(fbAuth, provider);
      }
    } catch (e) {
      if (e.code === "auth/credential-already-in-use" || e.code === "auth/account-exists-with-different-credential") {
        await fbm.signInWithPopup(fbAuth, provider);
      } else throw e;
    }
    const user = fbAuth.currentUser;
    diag.uid = user ? user.uid : "";
    diag.email = user ? (user.email || "") : "";
    if (ME() === "" && user && user.displayName) {
      try { localStorage.setItem(NAME_KEY, user.displayName.slice(0, 24)); } catch (e) {}
    }
    if (DEFTER_ID) {
      ledgerRole = null;
      cloudOn = false;
      cloudStarting = false;
      await startCloud();
    } else welcomeStart();
    return user;
  }

  function watchOwnLedgerRole(id) {
    const user = fbAuth && fbAuth.currentUser;
    if (!isGoogleUser(user) || isFixedAdmin(user)) return;
    const key = id + ":" + user.uid;
    if (ownRoleWatcherKey === key) return;
    if (ownRoleWatcher) ownRoleWatcher();
    ownRoleWatcherKey = key;
    ownRoleWatcher = fbm.onSnapshot(memberRef(id, user.uid), snap => {
      if (!snap.exists() || !["owner", "admin", "editor", "viewer"].includes(snap.data().role)) {
        ledgerRole = null;
        cloudOn = false;
        showAccountGate("Bu defterdeki erişiminiz kaldırıldı. Yöneticiyle iletişime geçin.");
        return;

      if (nextRole !== ledgerRole) {

        render();
        toast("Defter rolünüz güncellendi: " + (ROLE_LABEL[nextRole] || nextRole));

  async function ensureLedgerAccess(id) {
    const user = fbAuth && fbAuth.currentUser;
    if (!isGoogleUser(user)) return false;
    if (isFixedAdmin(user)) {
      const oref = ownerRef(id);
      const ownerSnap = await fbm.getDoc(oref);
      if (!ownerSnap.exists()) {
        await fbm.setDoc(oref, { ownerUid: user.uid, createdAt: new Date().toISOString() });
      }
      const selfRef = memberRef(id, user.uid);
      const self = await fbm.getDoc(selfRef);
      if (!self.exists() || self.data().role !== "owner") {
        await fbm.setDoc(selfRef, { role: "owner", email: user.email || "", name: user.displayName || "", addedAt: new Date().toISOString() });
      }
      ledgerRole = "owner";
      return true;
    }
    const oref = ownerRef(id);
    let ownerSnap = await fbm.getDoc(oref);
    if (!ownerSnap.exists()) {
      let ownsThisDevice = false;
      try { ownsThisDevice = localStorage.getItem("kirtasiye_sahip_" + id) === "1"; } catch (e) {}
      if (!ownsThisDevice) {
        ledgerRole = null;
        showAccountGate("Defter sahibi önce kendi oluşturduğu cihazdan Google girişi yapmalı. Bu tamamlanınca sahibi sizi ekleyebilir.");
        return false;
      }
      try {
        await fbm.setDoc(oref, { ownerUid: user.uid, createdAt: new Date().toISOString() });
      } catch (e) { /* another first user may have claimed it */ }
      ownerSnap = await fbm.getDoc(oref);
    }
    if (!ownerSnap.exists()) throw new Error("defter sahibi kaydı oluşturulamadı");
    if (ownerSnap.data().ownerUid === user.uid) {
      const self = await fbm.getDoc(memberRef(id, user.uid));
      if (!self.exists() || self.data().role !== "owner") {
        await fbm.setDoc(memberRef(id, user.uid), { role: "owner", email: user.email || "", name: user.displayName || "", addedAt: new Date().toISOString() });
      }
      ledgerRole = "owner";
      return true;
    }
    const member = await fbm.getDoc(memberRef(id, user.uid));
    if (!member.exists() || !["admin", "editor", "viewer"].includes(member.data().role)) {
      ledgerRole = null;
      showAccountGate("Bu Google hesabı bu deftere henüz üye değil. Defter bağlantısından üyelik başvurusu gönderebilirsiniz.");
      return false;
    }
    ledgerRole = member.data().role;
    return true;
  }

  async function loadLedgerMembers(host) {
    if (!host || !DEFTER_ID || !isGoogleUser(fbAuth && fbAuth.currentUser)) return;
    const token = ++memberLoadToken;
    if (!isLedgerManager()) {
      const user = fbAuth.currentUser;
      host.innerHTML = `<div class="meta">Bu defterdeki rolünüz: <b>${esc(ROLE_LABEL[ledgerRole] || "üye")}</b>. Kullanıcı kodunuz: <code>${esc(user.uid)}</code>. Üye ve başvuru yönetimi defter yöneticilerine açıktır.</div>`;
      return;
    }
    host.innerHTML = '<div class="meta">Üyeler ve başvurular yükleniyor…</div>';
    try {
      const [members, applications, globalApplications] = await Promise.all([
        fbm.getDocs(fbm.collection(fbDb, "defterler", DEFTER_ID, "uyeler")),
        fbm.getDocs(memberApplicationsRef(DEFTER_ID)),
        isFixedAdmin(fbAuth.currentUser) ? fbm.getDocs(adminApplicationsRef()) : Promise.resolve(null)
      ]);
      if (token !== memberLoadToken || !host.isConnected) return;
      const rows = [];
      members.forEach(d => {
        const m = d.data(), self = d.id === fbAuth.currentUser.uid;
        const canChange = !self && canAssignRole(m.role, m.role, d.id);
        const roleControl = canChange
          ? `<select class="inp" data-member-role="${esc(d.id)}" style="width:auto;min-width:132px;padding:7px">${roleOptions(m.role)}</select>`
          : `<span class="dev-me">${esc(ROLE_LABEL[m.role] || "Üye")}${self ? " · siz" : ""}</span>`;
        const removeControl = canRemoveMember(m.role, d.id)
          ? `<button class="btn btn-ghost" data-member-remove="${esc(d.id)}" style="color:var(--red)">Kaldır</button>`
          : "";
        rows.push(`<div class="mini-day" style="align-items:center;gap:8px">
          <div class="who" style="min-width:0;flex:1"><b>${esc(m.name || m.email || d.id)}</b><div class="meta">${esc(d.id)}</div></div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">${roleControl}${removeControl}</div>
        </div>`);
      });

      const pending = [];
      applications.forEach(d => {
        if (d.data().status === "pending") pending.push({ id: d.id, uid: d.id, ledgerId: DEFTER_ID, ...d.data() });
      });
      if (globalApplications) globalApplications.forEach(d => {
        const a = d.data();
        if (a.status !== "pending") return;
        const local = pending.find(x => x.ledgerId === a.defterId && x.uid === a.uid);
        if (local) { local.globalId = d.id; local.source = "global"; }
        else pending.push({ ...a, id: d.id, globalId: d.id, source: "global", ledgerId: a.defterId, uid: a.uid });
      });
      pending.sort((a,b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
      const requests = pending.map(a => {
        const key = (a.ledgerId || DEFTER_ID) + "/" + (a.uid || a.id);
        return `<div class="mini-day" style="align-items:center;gap:8px">
          <div class="who" style="min-width:0;flex:1"><b>${esc(a.name || a.email || a.uid || a.id)}</b>
            <div class="meta">${esc(a.email || "")} · Defter: ${esc(String(a.ledgerId || DEFTER_ID).slice(0,10))}… · UID: ${esc(a.uid || a.id)}</div>

        if (!canAssignRole(role, "", id)) return toast("Bu rolü atama yetkiniz yok");
        try {
          await fbm.setDoc(memberRef(DEFTER_ID, id), {
            role, email: "", name: "", addedAt: new Date().toISOString(), addedBy: fbAuth.currentUser.uid
          });
          toast(`${ROLE_LABEL[role]} rolüyle üye eklendi`); loadLedgerMembers(host);
        } catch (e) { toast("Üye eklenemedi: " + fbErr(e)); }
      };
      host.querySelectorAll("[data-member-role]").forEach(select => select.onchange = async () => {
        const userId = select.dataset.memberRole;
        const target = members.docs.find(d => d.id === userId);
        const newRole = select.value;
        if (!target || !canAssignRole(newRole, target.data().role, userId)) return loadLedgerMembers(host);
        select.disabled = true;
        try {
          await fbm.updateDoc(memberRef(DEFTER_ID, userId), { role: newRole });
          toast(`${ROLE_LABEL[newRole]} rolü kaydedildi`); loadLedgerMembers(host);
        } catch (e) { toast("Rol değiştirilemedi: " + fbErr(e)); loadLedgerMembers(host); }
      });
      host.querySelectorAll("[data-request-approve]").forEach(button => button.onclick = async () => {
        const key = button.dataset.requestApprove;
        const req = pending.find(x => (x.ledgerId || DEFTER_ID) + "/" + (x.uid || x.id) === key);
        if (!req) return;
        const roleSelect = [...host.querySelectorAll("[data-request-role]")].find(x => x.dataset.requestRole === key);
        const role = roleSelect ? roleSelect.value : "editor";
        if (!canAssignRole(role, "", req.uid || req.id)) return toast("Bu rolü atama yetkiniz yok");
        button.disabled = true;
        try {
          const now = new Date().toISOString(), ledgerId = req.ledgerId || DEFTER_ID, userId = req.uid || req.id;
          const batch = fbm.writeBatch(fbDb);
          batch.set(memberRef(ledgerId, userId), { role, email: req.email || "", name: req.name || "", addedAt: now, addedBy: fbAuth.currentUser.uid });
          batch.update(memberApplicationRef(ledgerId, userId), { status: "approved", handledAt: now, handledBy: fbAuth.currentUser.uid });
          if (req.globalId) batch.update(adminApplicationRef(req.globalId), { status: "approved", updatedAt: now, handledAt: now, handledBy: fbAuth.currentUser.uid });
          await batch.commit();
          toast(`Başvuru onaylandı; ${ROLE_LABEL[role]} erişimi açıldı`); loadLedgerMembers(host);
        } catch (e) { button.disabled = false; toast("Başvuru onaylanamadı: " + fbErr(e)); }

      host.querySelectorAll("[data-request-reject]").forEach(button => button.onclick = async () => {
        const key = button.dataset.requestReject;
        const req = pending.find(x => (x.ledgerId || DEFTER_ID) + "/" + (x.uid || x.id) === key);
        if (!req) return;
        button.disabled = true;
        try {
          const now = new Date().toISOString(), ledgerId = req.ledgerId || DEFTER_ID, userId = req.uid || req.id;
          const batch = fbm.writeBatch(fbDb);
          batch.update(memberApplicationRef(ledgerId, userId), { status: "rejected", handledAt: now, handledBy: fbAuth.currentUser.uid });
          if (req.globalId) batch.update(adminApplicationRef(req.globalId), { status: "rejected", updatedAt: now, handledAt: now, handledBy: fbAuth.currentUser.uid });
          await batch.commit();
          toast("Başvuru reddedildi"); loadLedgerMembers(host);
        } catch (e) { button.disabled = false; toast("Başvuru reddedilemedi: " + fbErr(e)); }
      });
      host.querySelectorAll("[data-member-remove]").forEach(button => button.onclick = async () => {

        if (!confirm("Bu kişinin defter erişimi kaldırılsın mı? Çevrimdışı kopyası cihazında kalmış olabilir.")) return;
        try { await fbm.deleteDoc(memberRef(DEFTER_ID, id)); toast("Üyenin erişimi kaldırıldı"); loadLedgerMembers(host); }
        catch (e) { toast("Üye kaldırılamadı: " + fbErr(e)); }
      });
    } catch (e) {
      if (token === memberLoadToken && host.isConnected) host.innerHTML = `<div class="meta" style="color:var(--red)">Üyeler okunamadı: ${esc(fbErr(e))}</div>`;

  function watchMembershipApplications() {
    const user = fbAuth && fbAuth.currentUser;
    if (!DEFTER_ID || !isGoogleUser(user) || !isLedgerManager()) return;
    const key = DEFTER_ID + ":" + user.uid;
    if (applicationWatcherKey === key) return;
    if (applicationWatcher) applicationWatcher();
    applicationWatcherKey = key;
    applicationWatcher = fbm.onSnapshot(memberApplicationsRef(DEFTER_ID), snap => {
      snap.docChanges().forEach(change => {
        if (change.type !== "added") return;
        const data = change.doc.data();
        if (data.status !== "pending" || change.doc.id === user.uid) return;
        toast("Yeni üyelik başvurusu geldi", { label: "Başvuruları gör", fn: () => openSettings() }, 8000);
      });
      const host = document.getElementById("memberHost");
      if (host && host.isConnected) loadLedgerMembers(host);
    }, e => console.warn("Üyelik başvuruları dinlenemedi:", e));
  }

  /* Başkasından gelen değişiklikte ekranı yenile (yazı yazarken bozma, kaydırmayı koru) */
  function scheduleRender() {
    clearTimeout(renderTimer);
    const attempt = () => {
      const a = document.activeElement;
      if (a && a.closest && a.closest("#app") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { renderTimer = setTimeout(attempt, 1200); return; }
      const pg = document.querySelector(".page"), top = pg ? pg.scrollTop : 0;
      render();
      const pg2 = document.querySelector(".page");
      if (pg2) pg2.scrollTop = top;
    };
    renderTimer = setTimeout(attempt, 250);
  }

  async function startCloud() {
    if (!DEFTER_ID || cloudOn || cloudStarting) return;
    cloudStarting = true;
    setSyncState("baglaniyor");
    const ok = await cloudInit();
    if (!ok) { cloudStarting = false; return setSyncState(navigator.onLine ? "hata" : "cevrimdisi", diag.err || "bulut yüklenemedi"); }
    try {
      await fbAuth.authStateReady();
      const user = fbAuth.currentUser;
      if (!isGoogleUser(user)) {
        cloudStarting = false;
        showAccountGate();
        return;
      }
      diag.uid = user.uid;
      diag.email = user.email || "";
      if (!(await ensureLedgerAccess(DEFTER_ID))) { cloudStarting = false; return; }
      watchOwnLedgerRole(DEFTER_ID);
      watchMembershipApplications();
      watchAdminApplications();
    } catch (e) {
      console.warn(e); cloudStarting = false;
      if (String(e.code || "").includes("permission-denied")) showAccountGate("Erişim reddedildi. Üyelik kurallarını ve defter davetinizi kontrol edin.");
      else setSyncState(navigator.onLine ? "hata" : "cevrimdisi", fbErr(e));
      return;
    }

    try {
      const v = Number(localStorage.getItem(JOIN_KEY));
      if (v) joinTs = v; else { joinTs = Date.now(); localStorage.setItem(JOIN_KEY, String(joinTs)); }
    } catch (e) { joinTs = Date.now(); }
    const SEED_KEY = SEED_PREFIX + DEFTER_ID;
    let seeded = false;
    try { seeded = localStorage.getItem(SEED_KEY) === "1"; } catch (e) {}
    if (!seeded) {
      /* Önbellekteki hali "buluttakiyle aynı" kabul edilir; yalnızca yeni değişiklikler gönderilir */
      db.kayitlar.forEach(k => remoteRec.set(k.id, JSON.stringify(k)));
      remoteSet = sharedSettingsJson();
      remoteLogo = db.firma.logo || "";
    }

    const onErr = e => { console.warn(e); setSyncState("hata", fbErr(e)); };

    fbm.onSnapshot(colRef("kayitlar"), { includeMetadataChanges: true }, snap => {
      let changed = false;
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        const i = db.kayitlar.findIndex(k => k.id === id);
        if (ch.type === "removed") { checkClosedSoon(); return; } /* kayıtlar asla silinmez; toplu silinme = defter taşındı */
        if (ch.doc.metadata.hasPendingWrites) return; /* bizim kendi yazdığımız */
        let rec;
        try { rec = JSON.parse(ch.doc.data().d); } catch (e) { return; }
        if (!rec || typeof rec !== "object") return;
        rec.id = id;
        normalizeRec(rec);
        const json = JSON.stringify(rec);
        if (i >= 0) {
          const localJson = JSON.stringify(db.kayitlar[i]);
          if (localJson === json) { remoteRec.set(id, json); return; }
          const base = remoteRec.get(id);
          if (base !== undefined && localJson !== base) return; /* bu cihazda gönderilmemiş değişiklik var, o kazanır */
          if (liveReady) pushNotes(db.kayitlar[i], rec);
          db.kayitlar[i] = rec;
        } else {
          if (liveReady) pushNotes(null, rec);
          db.kayitlar.push(rec);
        }
        remoteRec.set(id, json);
        changed = true;
      });
      if (!snap.metadata.fromCache) { const ilk = !liveReady; liveReady = true; if (ilk) scheduleRollover(1500); }
      flushNotes();
      diag.snaps++; diag.lastSnap = (snap.metadata.fromCache ? "önbellek" : "sunucu") + " " + new Date().toLocaleTimeString("tr-TR");
      setSyncState(snap.metadata.fromCache ? (navigator.onLine ? "baglaniyor" : "cevrimdisi") : "canli");
      if (changed) { cacheSave(); scheduleRender(); }
    }, onErr);

    fbm.onSnapshot(colRef("ayar"), snap => {
      let changed = false;
      snap.docChanges().forEach(ch => {
        if (ch.type === "removed" || ch.doc.metadata.hasPendingWrites) return;
        const raw = ch.doc.data().d;
        if (ch.doc.id === "genel") {
          let o; try { o = JSON.parse(raw); } catch (e) { return; }
          if (remoteSet && sharedSettingsJson() !== remoteSet) return; /* yerelde bekleyen değişiklik */
          if (o.magaza) db.magaza = o.magaza;
          const f = o.firma || {};
          db.firma = { ...db.firma, tel: f.tel || "", vergi: f.vergi || "", adres: f.adres || "" };
          db.silmePin = o.silmePin || null;
          db.hedef = Number(o.hedef) || 0;
          db.mesai = o.mesai || null;
          db.sablonlar = Array.isArray(o.sablonlar) ? o.sablonlar : null;
          db.otoErt = o.otoErt === false ? false : true;
          remoteSet = sharedSettingsJson();
          changed = true;
        } else if (ch.doc.id === "logo") {
          if (remoteLogo !== null && (db.firma.logo || "") !== remoteLogo) return;
          db.firma.logo = typeof raw === "string" ? raw : "";
          remoteLogo = db.firma.logo;
          changed = true;
        } else if (ch.doc.id === "cikarilan") {
          let m = {}; try { m = JSON.parse(raw) || {}; } catch (e) {}
          if (m[DEV_ID] && m[DEV_ID] > joinTs) leaveDefter("cikarildi");
        } else if (ch.doc.id === "kapali") {
          if (!renewing) leaveDefter("yenilendi");
        } else if (ch.doc.id === "kasa") {
          vaultRaw = raw;
        }
      });
      if (changed) { cacheSave(); scheduleRender(); }
    }, onErr);

    fbm.onSnapshot(colRef("aktif"), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === "removed") { aktifDocs.delete(ch.doc.id); return; }
        try { aktifDocs.set(ch.doc.id, ch.doc.data()); } catch (e) {}
      });
      recomputeActive();
    }, e => { diag.aktifErr = fbErr(e); });
    setInterval(recomputeActive, 15000);
    fbm.onSnapshot(colRef("cihaz"), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === "removed") { devDocs.delete(ch.doc.id); return; }
        try { devDocs.set(ch.doc.id, ch.doc.data()); } catch (e) {}
      });
      repaintDevices();
    }, e => { diag.cihazErr = fbErr(e); repaintDevices(); });
    setInterval(() => { if (!document.hidden) registerDevice(true); }, 45000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) registerDevice(true); });
    window.addEventListener("pagehide", () => registerDevice(false));
    window.addEventListener("pagehide", () => { try { clearActive(); } catch (e) {} });

    cloudOn = true; cloudStarting = false;
    registerDevice(true);
    /* İlk kurulumda bu cihazdaki eski kayıtlar buluta aktarılır */
    pushNow().then(okk => { if (okk && seeded) { try { localStorage.removeItem(SEED_KEY); } catch (e) {} } });
  }

  function schedulePush() {
    if (!cloudOn || !canWriteLedger()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 400);
  }

  /* Yalnızca değişen kayıtlar gönderilir */
  async function pushNow() {
    clearTimeout(pushTimer);
    if (!cloudOn) return false;
    if (!canWriteLedger()) { setSyncState("hazir"); return false; }
    const jobs = [];
    const track = (p, undo) => jobs.push(p.catch(e => { undo(); throw e; }));
    db.kayitlar.forEach(k => {
      const json = JSON.stringify(k);
      if (remoteRec.get(k.id) === json) return;
      remoteRec.set(k.id, json);
      track(fbm.setDoc(docRef("kayitlar", k.id), { d: json, u: fbm.serverTimestamp() }), () => remoteRec.delete(k.id));
    });
    const sj = sharedSettingsJson();
    if (remoteSet !== sj) {
      const old = remoteSet; remoteSet = sj;
      track(fbm.setDoc(docRef("ayar", "genel"), { d: sj, u: fbm.serverTimestamp() }), () => { remoteSet = old; });
    }
    const lg = db.firma.logo || "";
    if (remoteLogo !== lg) {
      const old = remoteLogo; remoteLogo = lg;
      track(fbm.setDoc(docRef("ayar", "logo"), { d: lg, u: fbm.serverTimestamp() }), () => { remoteLogo = old; });
    }
    if (!jobs.length) return true;
    try { await Promise.all(jobs); return true; }
    catch (e) { console.warn(e); setSyncState("hata", fbErr(e)); toast("Buluta gönderilemedi: " + fbErr(e)); return false; }
  }

  window.addEventListener("online", () => { if (DEFTER_ID && !cloudOn) startCloud(); else if (cloudOn) pushNow(); });

  async function resolveAdminApplication(app, status, role, host, button) {
    if (!isFixedAdmin(fbAuth && fbAuth.currentUser)) return toast("Bu işlem sistem yöneticisine açıktır");
    if (status === "approved" && !canAssignRole(role, "", app.uid)) return toast("Seçilen rol atanamıyor");
    button.disabled = true;
    try {
      const now = new Date().toISOString(), batch = fbm.writeBatch(fbDb);
      if (status === "approved") batch.set(memberRef(app.defterId, app.uid), {
        role, email: app.email || "", name: app.name || "", addedAt: now, addedBy: fbAuth.currentUser.uid
      });
      batch.update(memberApplicationRef(app.defterId, app.uid), { status, handledAt: now, handledBy: fbAuth.currentUser.uid });
      batch.update(adminApplicationRef(app.id), { status, updatedAt: now, handledAt: now, handledBy: fbAuth.currentUser.uid });
      await batch.commit();
      toast(status === "approved" ? `Başvuru onaylandı; ${ROLE_LABEL[role]} erişimi açıldı` : "Başvuru reddedildi");
      loadAdminInbox(host);

  /* ---- Çakışmasız tahsilat / erteleme ----
     Bulut açıkken işlem Firestore'da "işlem (transaction)" olarak yapılır: aynı anda iki kişi aynı kayda
     tahsilat girse bile tutarlar birbirinin üzerine yazılmaz, toplanır. İnternet yoksa yerelde yapılır. */
  async function mutateRecord(id, label, fn, opts = {}) {
    if (!canWriteLedger()) { if (!opts.auto) toast("Bu defterde salt görüntüleme yetkiniz var"); return false; }
    const auto = !!opts.auto;
    const local = db.kayitlar.find(x => x.id === id);
    if (!local) { if (!auto) toast("Kayıt artık yok"); return false; }
    const beforeJson = JSON.stringify(local);
    const me = auto ? "Sistem" : (ME() || "Bilinmiyor");
    if (cloudOn && navigator.onLine) {
      try {
        let result = null;
        await fbm.runTransaction(fbDb, async tx => {
          result = null;
          const ref = docRef("kayitlar", id);
          const snap = await tx.get(ref);
          let cur;
          if (snap.exists()) { cur = JSON.parse(snap.data().d); cur.id = id; normalizeRec(cur); }
          else cur = JSON.parse(beforeJson);
          const bo = JSON.parse(JSON.stringify(cur));
          if (fn(cur) === false) return; /* koşul artık geçerli değil (başka cihaz yapmış) */
          stampRec(cur, bo, me, new Date().toISOString());
          tx.set(ref, { d: JSON.stringify(cur), u: fbm.serverTimestamp() });
          result = cur;
        });
        if (!result) return false;
        const i = db.kayitlar.findIndex(x => x.id === id);
        if (i >= 0) db.kayitlar[i] = result; else db.kayitlar.push(result);
        remoteRec.set(id, JSON.stringify(result));
        if (!auto) {
          undoStack.push({ label, before: new Map([[id, beforeJson]]), touched: [id] });
          if (undoStack.length > 40) undoStack.shift();
        }
        cacheSave();
        return true;
      } catch (e) {
        console.warn("işlem başarısız", e);
        if (!/unavailable|offline|network|deadline/i.test(String((e && e.code) || e))) {
          if (!auto) toast("İşlem gönderilemedi: " + fbErr(e));
          return false;
        }
        /* internet yok: aşağıda yerelde uygulanır, bağlantı gelince otomatik gönderilir */
      }
    }
    if (auto) {
      if (fn(local) === false) return false;
      stampRec(local, JSON.parse(beforeJson), "Sistem", new Date().toISOString());
      cacheSave(); schedulePush();
      return true;
    }
    pushUndo(label);
    if (fn(local) === false) { pendingUndo = null; return false; }
    save();
    return true;
  }

  /* ---- Silme PIN'i (ortak, tüm cihazlar) ---- */
  async function sha256(txt) {
    try {
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
    } catch (e) { return "h" + hashPin(txt); }
  }
  function askPin(title, sub) {
    return new Promise(resolve => {
      const o = document.createElement("div");
      o.id = "askPinBox";
      o.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px";
      o.innerHTML = `
        <div style="background:var(--sheet);color:var(--ink);border-radius:16px;padding:18px;max-width:320px;width:100%;box-shadow:var(--shadow)">
          <h3 style="font-size:17px;margin-bottom:4px">${esc(title)}</h3>
          <p class="meta" style="margin-bottom:10px">${esc(sub || "")}</p>
          <input class="inp" id="apIn" type="password" autocomplete="off" maxlength="40" placeholder="Şifre" style="text-align:center;letter-spacing:.15em" />
          <div class="g2" style="margin-top:12px"><button class="btn btn-ghost" id="apNo">Vazgeç</button><button class="btn btn-gold" id="apOk">Tamam</button></div>
        </div>`;
      document.body.appendChild(o);
      const inp = o.querySelector("#apIn");
      setTimeout(() => inp.focus(), 30);
      const done = v => { o.remove(); resolve(v); };
      o.querySelector("#apNo").onclick = () => done(null);
      o.querySelector("#apOk").onclick = () => done(inp.value.trim());
      inp.addEventListener("keydown", e => { if (e.key === "Enter") done(inp.value.trim()); });
    });
  }

  const isMine = rec => { const me = ME(); return !!me && rec.sonKim === me; };
  function describeChange(old, rec) {
    const kim = rec.sonKim || "Biri";
    if (!old) return rec.silindi ? null : `${kim} yeni kayıt ekledi: ${rec.musteri} · ${fmtTRY(rec.tutar)}`;
    if (rec.silindi && !old.silindi) return `${kim} kaydı sildi: ${rec.musteri}`;
    if (!rec.silindi && old.silindi) return `${kim} kaydı geri getirdi: ${rec.musteri}`;
    const dt = round2((rec.tahsilTutar || 0) - (old.tahsilTutar || 0));
    if (dt > 0) return `${kim} tahsilat girdi: ${rec.musteri} · ${fmtTRY(dt)}`;
    if ((rec.ertelemeSayisi || 0) > (old.ertelemeSayisi || 0)) return `${kim} erteledi: ${rec.musteri} → ${fmtDate(rec.vade)}`;
    return `${kim} kaydı düzenledi: ${rec.musteri}`;
  }

      d: JSON.stringify({ ad: ME() || "Biri", k: id, t: Date.now(), c: DEV_ID }), u: fbm.serverTimestamp()

    myActive = null;
    clearInterval(activeTimer);
    if (cloudOn) fbm.deleteDoc(docRef("aktif", DEV_ID)).catch(() => {});
  }
  function recomputeActive() {
    const m = new Map(), now = Date.now();
    aktifDocs.forEach(data => {
      let o; try { o = JSON.parse(data.d); } catch (e) { return; }
      if (!o || o.c === DEV_ID || !o.k) return;
      const ts = data.u && data.u.toMillis ? data.u.toMillis() : o.t;
      if (now - ts > 70000) return; /* 70 sn işaret yenilenmediyse düzenleme bitmiş sayılır */
      if (!m.has(o.k)) m.set(o.k, []);
      m.get(o.k).push(o.ad || "Biri");
    });
    const sig = x => JSON.stringify([...x.entries()].sort());
    if (sig(m) === sig(activeByRec)) return;
    activeByRec = m;
    paintActive();
    scheduleRender();
  }

  }
  {
    const _d = openDetail, _f = openForm, _t = openTahsil, _e = openErtele;
    openDetail = k => { _d(k); trackSheet(k.id, false); };
    openForm = (edit, pre) => { _f(edit, pre); trackSheet(edit ? edit.id : null, !!edit); };
    openTahsil = async k => { if (!(await mesaiGuard())) return; _t(k); trackSheet(k.id, true); };
    openErtele = k => { _e(k); trackSheet(k.id, true); };
  }

  /* ================= ERTELENEN SINIFI · OTOMATİK ERTELEME · BAĞLI CİHAZLAR ================= */

  /* Ertelenen = açık kayıt + en az bir kez ertelenmiş (elle ya da otomatik) */
  function isErt(k) { return isOpen(k) && (k.ertelemeSayisi || 0) > 0; }
  const ertList = (maxIso) => kayitlar().filter(k => isErt(k) && (!maxIso || (k.vade && k.vade <= maxIso)))
    .sort((a, b) => (a.vade || "").localeCompare(b.vade || "") || (a.musteri || "").localeCompare(b.musteri || "", "tr"));
  function ertTag(k) {
    if (!isErt(k)) return "";
    const son = (k.ertelemeGecmisi || []).slice(-1)[0] || {};
    return `<span class="ert-tag">↻ ${k.ertelemeSayisi}. erteleme${son.auto ? " · oto" : ""}</span>`;
  }

  /* Vade gününde tahsil edilmeyen kayıt, ertesi güne (bugüne) kendiliğinden ertelenir.
     Birden fazla cihaz aynı anda açıksa çift işlem olmasın diye sunucuda "işlem" olarak ve koşul denetimiyle yapılır. */
  let rolling = false, rollTimer = null;
  function scheduleRollover(ms) { clearTimeout(rollTimer); rollTimer = setTimeout(autoRollover, ms || 1200); }
  async function autoRollover() {
    if (rolling || db.otoErt === false) return;
    rolling = true;
    try {
      const t = todayISO();
      const hedefGun = firstWorkdayOnOrAfter(t); /* bugün mesai günüyse bugün; değilse sonraki mesai günü */
      /* geçmiş vadeliler VE bugün mesai günü olmadığında bugün vadeliler devredilir */
      const due = rec => isOpen(rec) && rec.vade && (rec.vade < t || (rec.vade === t && !isWorkday(t)));
      const ids = kayitlar().filter(due).map(k => k.id);
      let n = 0;
      for (const id of ids) {
        const ok = await mutateRecord(id, "Otomatik erteleme", rec => {
          if (!due(rec)) return false; /* başka cihaz zaten ertelemiş */
          const eski = rec.vade, now = new Date().toISOString();
          const neden = !isWorkday(eski) ? "Otomatik: mesai günü değil" : (hedefGun !== t ? "Otomatik: vade gününde alınmadı, bugün mesai günü değil" : "Otomatik: vade gününde tahsil edilmedi");
          rec.ertelemeGecmisi = rec.ertelemeGecmisi || [];
          rec.ertelemeGecmisi.push({ eski, yeni: hedefGun, neden, t: now, auto: true });
          rec.orijinalVade = rec.orijinalVade || eski;
          rec.vade = hedefGun;
          rec.durum = "bekliyor";
          rec.ertelemeSayisi = (rec.ertelemeSayisi || 0) + 1;
          rec.gecmis = rec.gecmis || [];
          rec.gecmis.push({ t: now, a: "ertelendi", d: `${fmtDate(eski)} → ${fmtDate(hedefGun)} (otomatik)`, auto: true });
          return true;
        }, { auto: true });
        if (ok) n++;
      }
      if (n) { render(); toast(`↻ ${n} tahsilat ${hedefGun === t ? "bugüne" : fmtDate(hedefGun).slice(0, 5) + " tarihine (sonraki mesai günü)"} ertelendi`, null, 4800); }
    } catch (e) { console.warn("otomatik erteleme", e); }
    finally { rolling = false; }
  }
  setInterval(() => { if (!document.hidden) scheduleRollover(600); }, 300000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleRollover(900); });

  /* ---- Bağlı cihazlar ---- */
  const CIHAZ_ESIK = 100000; /* 100 sn içinde işaret verdiyse çevrimiçi */
  const devDocs = new Map();
  function deviceLabel() {
    const u = navigator.userAgent || "";
    const os = /iPhone/.test(u) ? "iPhone" : (/iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) ? "iPad"
      : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac OS X|Macintosh/.test(u) ? "Mac" : /Linux/.test(u) ? "Linux" : "Cihaz";
    const br = /Edg\//.test(u) ? "Edge" : /OPR\/|Opera/.test(u) ? "Opera" : /Firefox\//.test(u) ? "Firefox" : /(Chrome|CriOS)\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : "";
    let pwa = false; try { pwa = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || !!navigator.standalone; } catch (e) {}
    return os + (br ? " · " + br : "") + (pwa ? " (uygulama)" : "");
  }
  const FIRST_KEY = "kirtasiye_ilk_gorulme";
  function registerDevice(on) {
    if (!cloudOn) return;
    let ilk = Date.now();
    try { const v = Number(localStorage.getItem(FIRST_KEY)); if (v) ilk = v; else localStorage.setItem(FIRST_KEY, String(ilk)); } catch (e) {}
    fbm.setDoc(docRef("cihaz", DEV_ID), {
      d: JSON.stringify({ ad: ME() || "Adsız", cz: deviceLabel(), t: Date.now(), ilk, on: on !== false }), u: fbm.serverTimestamp()
    }).catch(e => { diag.cihazErr = fbErr(e); });
  }
  const ago = ms => {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return "az önce"; const m = Math.round(s / 60); if (m < 60) return m + " dk önce";
    const h = Math.round(m / 60); if (h < 24) return h + " sa önce"; return Math.round(h / 24) + " gün önce";
  };
  function deviceList() {
    const now = Date.now(), out = [];
    devDocs.forEach((data, id) => {
      let o; try { o = JSON.parse(data.d); } catch (e) { return; }
      if (!o) return;
      const ts = (data.u && data.u.toMillis) ? data.u.toMillis() : (o.t || 0);
      const self = id === DEV_ID;
      out.push({ id, ad: o.ad || "Adsız", cz: o.cz || "Cihaz", last: ts, self, online: self ? cloudOn : (o.on !== false && now - ts < CIHAZ_ESIK) });
    });
    if (!out.some(x => x.self) && cloudOn) out.push({ id: DEV_ID, ad: ME() || "Adsız", cz: deviceLabel(), last: now, self: true, online: true });
    return out.sort((a, b) => (b.self - a.self) || (b.online - a.online) || (b.last - a.last));
  }
  const onlineCount = () => cloudOn ? deviceList().filter(d => d.online).length : 0;
  function devicesHtml() {
    if (!DEFTER_ID) return `<div class="meta">Bu cihaz bir ortak defterle bağlı değil.</div>`;
    const list = deviceList(), on = list.filter(d => d.online).length;
    return `
      <div class="dev-sum"><b>${list.length}</b> cihaz bağlı · <b>${on}</b> şu an çevrimiçi</div>
      <div class="dev-list">
        ${list.map(d => `
          <div class="dev-row ${d.online ? "on" : ""}">
            <span class="dev-dot"></span>
            <div class="dev-mid"><b>${esc(d.ad)}${d.self ? `<span class="dev-me">Bu cihaz</span>` : ""}</b><span>${esc(d.cz)} · ${d.online ? "şu an çevrimiçi" : "son görülme " + ago(d.last)}</span></div>
            ${(!d.self && adminActive()) ? `<button class="dev-del" data-devkick="${d.id}">Çıkar</button>` : ""}
          </div>`).join("") || `<div class="dev-row"><div class="dev-mid"><span>Henüz cihaz bilgisi yok</span></div></div>`}
      </div>
      ${diag.cihazErr ? `<p class="meta" style="margin-top:6px">Cihaz listesi tam çalışmıyor (${esc(diag.cihazErr)}). Firestore kurallarını güncelleyin.</p>` : ""}`;
  }
  function repaintDevices() {
    document.querySelectorAll("[data-devhost]").forEach(host => {
      host.innerHTML = devicesHtml();
      host.querySelectorAll("[data-devkick]").forEach(b => b.onclick = () => kickDevice(b.dataset.devkick));
    });
    setSyncState(syncState, syncDetail); /* başlıktaki "N cihaz" yazısını tazele */
  }
  setInterval(() => { if (cloudOn) repaintDevices(); }, 20000);

  /* ================= GÜVENİLİRLİK PUANI · AKTİVİTE AKIŞI · AYLIK HEDEF · CİHAZ ÇIKARMA / BAĞLANTI YENİLEME ================= */
  let leaving = false, renewing = false, joinTs = 0, closedTimer = null;
  const JOIN_KEY = "kirtasiye_katilim";

  /* ---- 1) Müşteri güvenilirlik puanı (ilk vadeye göre gecikme + erteleme sıklığı) ---- */
  let renderTick = 0, scoreTick = -1, scoreCache = new Map(), actTick = -1, actCache = [];
  const dayDiff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  function lastCollectIso(k) {
    const ev = (k.gecmis || []).filter(g => g.a === "tahsil" || g.a === "kismi").map(g => g.tarih || String(g.t).slice(0, 10)).sort();
    return ev.length ? ev[ev.length - 1] : (k.tahsilTarihi || null);
  }
  function computeScores() {
    const t = todayISO(), by = new Map();
    kayitlar().forEach(k => {
      if (statusOf(k) === "iptal") return;
      const n = (k.musteri || "").trim(); if (!n) return;
      if (!by.has(n)) by.set(n, []);
      by.get(n).push(k);
    });
    const out = new Map();
    by.forEach((list, ad) => {
      let paid = 0, onTime = 0, waitN = 0, delaySum = 0, ert = 0, longOpen = 0;
      list.forEach(k => {
        ert += k.ertelemeSayisi || 0;
        const ref = k.orijinalVade || k.vade; if (!ref) return;
        if (statusOf(k) === "tahsil") {
          const d = Math.max(0, dayDiff(ref, lastCollectIso(k) || k.vade));
          paid++; delaySum += d; if (d <= 1) onTime++;
        } else if (isOpen(k) && ref < t) {
          const d = dayDiff(ref, t); waitN++; delaySum += d; if (d >= 30) longOpen++;
        }
      });
      const denom = paid + waitN, avg = denom ? delaySum / denom : 0, er = ert / list.length;
      let sc = 5;
      sc -= avg >= 15 ? 3 : avg >= 8 ? 2 : avg >= 4 ? 1 : avg >= 2 ? 0.5 : 0;
      sc -= er >= 2 ? 1.5 : er >= 1 ? 1 : er >= 0.5 ? 0.5 : 0;
      if (longOpen) sc -= 0.5;
      sc = Math.min(5, Math.max(1, Math.round(sc * 2) / 2));
      const yeni = list.length < 2;
      out.set(ad, { ad, score: sc, yeni, n: list.length, paid, onTime, avg: Math.round(avg * 10) / 10, ert, er: Math.round(er * 10) / 10,
        label: yeni ? "Yeni müşteri" : sc >= 4.5 ? "Çok güvenilir" : sc >= 3.5 ? "Güvenilir" : sc >= 2.5 ? "Dikkatli" : "Riskli" });
    });
    return out;
  }
  function scoreOf(ad) {
    if (scoreTick !== renderTick) { scoreCache = computeScores(); scoreTick = renderTick; }
    return scoreCache.get((ad || "").trim());
  }
  const trNum = n => String(n).replace(".", ",");
  const scoreColor = s => (!s || s.yeni) ? "var(--mute)" : s.score >= 3.5 ? "var(--gold-dim)" : s.score >= 2.5 ? "var(--erte)" : "var(--red)";
  const starsHtml = s => `<span class="stars" style="--p:${s.yeni ? 0 : s.score / 5 * 100}%;--sc:${scoreColor(s)}">★★★★★</span>`;
  function scoreLine(ad) {
    const s = scoreOf(ad); if (!s) return "";
    if (s.yeni) return `<div class="meta score-line">Yeni müşteri · puan için en az 2 kayıt gerekir</div>`;
    return `<div class="score-line">${starsHtml(s)} <b style="color:${scoreColor(s)}">${trNum(s.score)}</b> <span class="meta">· ${s.label}</span></div>`;
  }
  function scoreChip(k) {
    const s = scoreOf(k.musteri);
    if (!s || s.yeni || s.score >= 3) return "";
    return `<span class="sc-chip" style="--sc:${scoreColor(s)}">${s.score < 2.5 ? "⚠ Riskli" : "★ Dikkatli"}</span>`;
  }
  function scorePanel(ad) {
    const s = scoreOf(ad); if (!s) return "";
    if (s.yeni) return `<div class="panel score-panel"><b>Güvenilirlik puanı</b><div class="meta" style="margin-top:4px">Henüz yeterli geçmiş yok. En az 2 kayıt olunca puan hesaplanır.</div></div>`;
    const pct = s.paid ? Math.round(s.onTime / s.paid * 100) : null;
    return `<div class="panel score-panel">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><b>Güvenilirlik puanı</b><div style="margin-top:3px">${starsHtml(s)} <b style="color:${scoreColor(s)}">${trNum(s.score)}</b></div></div>
        <div class="sc-label" style="--sc:${scoreColor(s)}">${s.label}</div>
      </div>
      <div class="score-facts">
        <div><b>${trNum(s.avg)} gün</b><span>ortalama gecikme</span></div>
        <div><b>${s.ert}</b><span>erteleme (${trNum(s.er)}/kayıt)</span></div>
        <div><b>${pct === null ? "—" : "%" + pct}</b><span>zamanında ödeme${s.paid ? ` (${s.onTime}/${s.paid})` : ""}</span></div>
      </div>
      <div class="meta" style="margin-top:8px">İlk vadeye göre hesaplanır. Ödeme ilk vadeden en çok 1 gün sonra gelirse “zamanında” sayılır.</div>
    </div>`;
  }

  /* ---- 2) Aktivite akışı ---- */
  const dayOf = t => toISO(new Date(t));
  const ACT_ICON = { olusturuldu: ["✚", "pl"], duzenlendi: ["✎", "pl"], tahsil: ["✓", "th"], kismi: ["◐", "th"], ertelendi: ["↻", "er"], silindi: ["✕", "ge"], geri: ["↺", "pl"] };
  function activityEvents() {
    if (actTick === renderTick) return actCache;
    const ev = [];
    db.kayitlar.forEach(k => {
      (k.gecmis || []).forEach(g => { if (g.t) ev.push({ t: g.t, a: g.a, d: g.d, kim: g.k || "", auto: !!g.auto, k }); });
      if (k.silindi && k.sonT && !(k.gecmis || []).some(g => g.a === "silindi")) ev.push({ t: k.sonT, a: "silindi", d: "", kim: k.sonKim || "", k });
    });
    ev.sort((a, b) => String(b.t).localeCompare(String(a.t)));
    actCache = ev; actTick = renderTick;
    return ev;
  }
  function actText(e) {
    const k = e.k;
    switch (e.a) {
      case "olusturuldu": return `Yeni kayıt · ${fmtTRY(k.tutar)}`;
      case "duzenlendi": return "Kaydı düzenledi";
      case "tahsil": return `Tahsil etti · ${e.d || ""}`;
      case "kismi": return `Kısmi tahsilat · ${e.d || ""}`;
      case "ertelendi": return `${e.auto ? "Otomatik erteledi" : "Erteledi"} · ${String(e.d || "").replace(" (otomatik)", "")}`;
      case "silindi": return `Tahsilatı sildi · ${fmtTRY(k.tutar)}`;
      case "geri": return "Silinen kaydı geri getirdi";
      default: return ACT_AD[e.a] || e.a;
    }
  }
  const hhmm = t => new Date(t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  function actStamp(e) {
    const iso = dayOf(e.t), today = todayISO();
    return iso === today ? hhmm(e.t) : iso === addDays(today, -1) ? "dün " + hhmm(e.t) : fmtDate(iso).slice(0, 5) + " " + hhmm(e.t);
  }
  function actRow(e, withDate) {
    const [ic, cl] = ACT_ICON[e.a] || ["•", "pl"];
    return `<div class="row" ${e.k.silindi ? "" : `data-open="${e.k.id}"`}>
      <div class="ic ${cl}">${ic}</div>
      <div class="mid"><div class="t1">${esc(e.kim || "Biri")} · ${esc(e.k.musteri)}</div><div class="t2 wrap">${esc(actText(e))}</div></div>
      <div class="v" style="font-size:12px;font-weight:700;color:var(--mute)">${withDate ? actStamp(e) : hhmm(e.t)}</div></div>`;
  }
  function recentActivityHtml() {
    const ev = activityEvents().slice(0, 6);
    if (!ev.length) return "";
    return `<div class="sec-title">Son hareketler</div>
      <div class="group">${ev.map(e => actRow(e, true)).join("")}</div>
      <button class="btn btn-ghost" id="actAll" style="width:100%;margin-top:10px">Aktivite akışının tamamı</button>`;
  }
  let actFilter = "7", actWho = "";
  function openActivity() {
    const all = activityEvents(), today = todayISO();
    const from = actFilter === "bugun" ? today : actFilter === "7" ? addDays(today, -6) : "0000-00-00";
    const people = [...new Set(all.map(e => e.kim).filter(Boolean))].sort((a, b) => a.localeCompare(b, "tr"));
    const list = all.filter(e => dayOf(e.t) >= from && (!actWho || e.kim === actWho));
    const tList = all.filter(e => dayOf(e.t) === today);
    const tahsilBugun = round2(collectEvents().filter(e => e.iso === today).reduce((a, e) => a + e.tutar, 0));
    const shown = list.slice(0, 150);
    const groups = [];
    shown.forEach(e => { const d = dayOf(e.t); const g = groups[groups.length - 1]; if (g && g.d === d) g.items.push(e); else groups.push({ d, items: [e] }); });
    openSheet(`
      <div class="sheet-card full">
        <div class="grab"></div>
        <div style="display:flex;align-items:center;gap:8px">
          <h2 style="flex:1;font-size:18px">Aktivite akışı</h2>
          <button class="btn btn-ghost" id="sheetClose">Kapat</button>
        </div>
        <div class="meta" style="margin:10px 2px 6px">Bugün</div>
        <div class="kpis" style="margin-top:0">
          <div class="kpi pl"><div class="k"><i></i>Yeni kayıt</div><div class="v">${tList.filter(e => e.a === "olusturuldu").length}</div></div>
          <div class="kpi th"><div class="k"><i></i>Tahsilat</div><div class="v">${fmtK(tahsilBugun)}</div></div>
          <div class="kpi er"><div class="k"><i></i>Ertelenen</div><div class="v">${tList.filter(e => e.a === "ertelendi").length}</div></div>
        </div>
        <div class="chips" style="margin:6px 0 8px">
          ${[["bugun", "Bugün"], ["7", "Son 7 gün"], ["tum", "Tümü"]].map(([id, ad]) => `<button class="chip ${actFilter === id ? "on" : ""}" data-actf="${id}">${ad}</button>`).join("")}
        </div>
        ${people.length ? `<div class="chips" style="margin:0 0 6px"><button class="chip ${!actWho ? "on" : ""}" data-actw="">Herkes</button>${people.map(p => `<button class="chip ${actWho === p ? "on" : ""}" data-actw="${esc(p)}">${esc(p)}</button>`).join("")}</div>` : ""}
        ${groups.length ? groups.map(g => `
          <div class="day-h"><b class="${g.d === today ? "today" : ""}">${g.d === today ? "Bugün" : g.d === addDays(today, -1) ? "Dün" : fmtLong(g.d)}</b><span>${g.items.length} hareket</span></div>
          <div class="group">${g.items.map(e => actRow(e, false)).join("")}</div>`).join("")
          : `<div class="empty">Bu aralıkta hareket yok.</div>`}
        ${list.length > shown.length ? `<p class="meta" style="text-align:center;margin-top:10px">Son ${shown.length} hareket gösteriliyor.</p>` : ""}
        <p class="meta" style="margin-top:10px">Bu özelliğin eklenmesinden önce yapılan işlemlerde “kim yaptı” bilgisi olmayabilir.</p>
      </div>`, true);
    document.getElementById("sheetClose").onclick = closeSheet;
    document.querySelectorAll("[data-actf]").forEach(b => b.onclick = () => { actFilter = b.dataset.actf; openActivity(); });
    document.querySelectorAll("[data-actw]").forEach(b => b.onclick = () => { actWho = b.dataset.actw; openActivity(); });
    document.querySelectorAll("#sheet .row[data-open]").forEach(r => r.onclick = () => {
      const k = kayitlar().find(x => x.id === r.dataset.open);
      if (k) openDetail(k);
    });
  }

  /* ---- 3) Aylık tahsilat hedefi ---- */
  function hedefInfo() {
    const goal = Number(db.hedef) || 0; if (!goal) return null;
    const t = todayISO(), ym = t.slice(0, 7), y = +t.slice(0, 4), m = +t.slice(5, 7);
    const dim = new Date(y, m, 0).getDate(), left = dim - (+t.slice(8)) + 1, monthEnd = `${ym}-${z2(dim)}`;
    const ev = collectEvents();
    const sumIn = pre => round2(ev.filter(e => e.iso.startsWith(pre)).reduce((a, e) => a + e.tutar, 0));
    const got = sumIn(ym);
    const pd = new Date(y, m - 2, 1), prev = `${pd.getFullYear()}-${z2(pd.getMonth() + 1)}`;
    const openDue = round2(kayitlar().filter(k => isOpen(k) && k.vade && k.vade <= monthEnd).reduce((a, k) => a + remaining(k), 0));
    const need = Math.max(0, round2(goal - got));
    return { goal, got, pct: got / goal * 100, need, left, perDay: Math.ceil(need / Math.max(1, left)), openDue, proj: round2(got + openDue), prevTotal: sumIn(prev), ay: AY[m - 1], done: got >= goal };
  }
  function hedefCard() {
    const h = hedefInfo();
    if (!h) return "";
    return `<div class="goal">
      <div class="goal-top"><b>🎯 ${h.ay} hedefi</b><span>%${Math.round(h.pct)}</span></div>
      <div class="goal-num"><b>${fmtK(h.got)}</b> / ${fmtK(h.goal)}</div>
      <div class="goalbar"><i class="${h.done ? "ok" : ""}" style="width:${Math.min(100, h.pct)}%"></i></div>
      <div class="goal-meta">${h.done ? "🎉 Hedef tamamlandı" : `Kalan <b>${fmtK(h.need)}</b> · günde ~<b>${fmtK(h.perDay)}</b> (${h.left} gün)`}</div>
      <div class="goal-meta">Ay sonuna kadar beklenen toplam: <b>${fmtK(h.proj)}</b> (%${Math.round(h.proj / h.goal * 100)}) · Geçen ay: ${fmtK(h.prevTotal)}</div>
    </div>`;
  }
  function openGoalSheet() {
    openSheet(`
      <div class="sheet-card">
        <div class="grab"></div>
        <h2 style="font-size:18px">Aylık tahsilat hedefi</h2>
        <p class="meta" style="margin:6px 0 10px">Her ay için geçerli hedef tutar. Özet ekranında ilerleme çubuğu olarak görünür. Bu ayar tüm cihazlarda ortaktır.</p>
        <input class="inp" id="gIn" inputmode="decimal" placeholder="örn. 150.000" value="${db.hedef ? esc(String(db.hedef).replace(".", ",")) : ""}" />

        ${db.hedef ? `<button class="btn btn-ghost" id="gDel" style="width:100%;margin-top:8px">Hedefi kaldır</button>` : ""}
        <button class="btn btn-ghost" id="sheetClose" style="width:100%;margin-top:8px">Vazgeç</button>

  /* ---- 4) Cihazı uzaktan çıkar · bağlantıyı yenile ---- */
  function showLeftScreen(reason) {
    const [h, p] = reason === "cikarildi"
      ? ["Bu cihaz defterden çıkarıldı", "Defter sahibi bu cihazın bağlantısını kesti. Yeniden katılmak için güncel bağlantıyı defter sahibinden isteyin."]
      : ["Defter bağlantısı yenilendi", "Güvenlik için eski bağlantı kapatıldı. Yeni bağlantıyı defter sahibinden isteyin."];
    document.getElementById("app").innerHTML = `
      <div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px">
        <div class="panel" style="max-width:440px;width:100%;padding:24px">
          <div style="font-size:11px;letter-spacing:.18em;color:var(--mute);font-weight:700;text-align:center">ÖDEME DEFTERİ</div>
          <h2 style="text-align:center;margin:8px 0 6px;font-size:20px">${h}</h2>
          <p class="meta" style="text-align:center;margin-bottom:14px">${p}</p>
          <input class="inp" id="wLink" placeholder="Yeni defter bağlantısını buraya yapıştırın" />

        </div>
      </div>`;
    document.getElementById("wJoin").onclick = () => joinDefter(document.getElementById("wLink").value);
  }
  function leaveDefter(reason) {
    if (leaving) return;
    leaving = true; cloudOn = false;
    try {
      localStorage.removeItem(ID_KEY); localStorage.removeItem(JOIN_KEY);
      localStorage.removeItem(KEY + ":" + DEFTER_ID); localStorage.removeItem(SEED_PREFIX + DEFTER_ID);
    } catch (e) {}
    try { closeSheet(); } catch (e) {}
    showLeftScreen(reason);
  }
  function checkClosedSoon() {
    clearTimeout(closedTimer);
    closedTimer = setTimeout(async () => {
      try { const s = await fbm.getDocFromServer(docRef("ayar", "kapali")); if (s.exists() && !renewing) leaveDefter("yenilendi"); } catch (e) {}
    }, 1500);
  }
  async function kickDevice(id) {
    let ad = "cihaz"; try { ad = JSON.parse((devDocs.get(id) || {}).d).ad || "cihaz"; } catch (e) {}
    if (!confirm(`“${ad}” cihazı defterden çıkarılsın mı?\\n\\nCihaz açıksa hemen, kapalıysa açıldığında bağlantısı kesilir. Bağlantıyı bilmeye devam eder; tamamen engellemek için “Bağlantıyı yenile”yi kullanın.`)) return;
    if (!(await guardDelete())) return;
    try {
      await fbm.runTransaction(fbDb, async tx => {
        const ref = docRef("ayar", "cikarilan"); const snap = await tx.get(ref);
        let m = {}; if (snap.exists()) { try { m = JSON.parse(snap.data().d) || {}; } catch (e) {} }
        m[id] = Date.now();
        Object.keys(m).forEach(k => { if (Date.now() - m[k] > 30 * 864e5) delete m[k]; });
        tx.set(ref, { d: JSON.stringify(m), u: fbm.serverTimestamp() });
      });
      await fbm.deleteDoc(docRef("cihaz", id));
      toast(`“${ad}” çıkarıldı`);
      if (confirm("Bağlantıyı da yenilemek ister misiniz?\\n(Çıkardığınız kişinin eski bağlantıyla tekrar girmesini engeller.)")) renewLink();
    } catch (e) { toast("Çıkarılamadı: " + fbErr(e)); }
  }
  async function renewLink() {
    if (!cloudOn) return toast("Önce internete bağlanın");
    if (!(await guardDelete())) return;
    const t = prompt("Defter YENİ bir bağlantıya taşınacak, ESKİ bağlantı kapanacak.\\nDiğer cihazlar yeni bağlantıyı isteyecek (siz kendiniz dağıtırsınız).\\nİşlem sırasında kimse kayıt girmesin.\\n\\nDevam için büyük harfle YENILE yazın:");
    if (!t || t.trim().toUpperCase().replace("İ", "I") !== "YENILE") return toast("Vazgeçildi");
    renewing = true;
    toast("Defter taşınıyor… lütfen sayfayı kapatmayın", null, 120000);
    const oldId = DEFTER_ID, newId = newToken();
    const col = (id, c) => fbm.collection(fbDb, "defterler", id, c);
    try {
      await pushNow();
      const docs = [];
      for (const c of ["kayitlar", "ayar"]) {
        const snap = await fbm.getDocsFromServer(col(oldId, c));
        snap.forEach(d => { if (!(c === "ayar" && (d.id === "cikarilan" || d.id === "kapali"))) docs.push([c, d.id, d.data()]); });
      }
      for (let i = 0; i < docs.length; i += 400) {
        const b = fbm.writeBatch(fbDb);
        docs.slice(i, i + 400).forEach(([c, id, data]) => b.set(fbm.doc(fbDb, "defterler", newId, c, id), { d: data.d, u: fbm.serverTimestamp() }));
        await b.commit();
      }
      const want = docs.filter(x => x[0] === "kayitlar").length;
      const chk = await fbm.getDocsFromServer(col(newId, "kayitlar"));
      if (chk.size < want) throw new Error("doğrulama: " + chk.size + "/" + want);
      /* eski defteri kapat: önce işaret (diğer cihazlar hemen anlasın), sonra eski belgeleri sil */
      await fbm.setDoc(fbm.doc(fbDb, "defterler", oldId, "ayar", "kapali"), { d: JSON.stringify({ t: Date.now(), by: ME() || "" }), u: fbm.serverTimestamp() });
      const old = [];
      for (const c of ["kayitlar", "aktif", "cihaz", "ayar"]) {
        const snap = await fbm.getDocsFromServer(col(oldId, c));
        snap.forEach(d => { if (!(c === "ayar" && d.id === "kapali")) old.push(d.ref); });
      }
      for (let i = 0; i < old.length; i += 400) {
        const b = fbm.writeBatch(fbDb);
        old.slice(i, i + 400).forEach(r => b.delete(r));
        await b.commit();
      }
      cloudOn = false;
      try {
        localStorage.setItem(ID_KEY, newId); localStorage.setItem(JOIN_KEY, String(Date.now())); localStorage.setItem("kirtasiye_sahip_" + newId, "1");
        localStorage.setItem(KEY + ":" + newId, JSON.stringify(db));
        localStorage.removeItem(KEY + ":" + oldId); localStorage.removeItem(SEED_PREFIX + newId);
        localStorage.setItem("kirtasiye_ilk_baglanti", "1");
      } catch (e) {}
      location.hash = "d=" + newId;
      location.reload();
    } catch (e) {
      renewing = false;
      console.warn("bağlantı yenileme", e);
      toast("Yenileme tamamlanamadı: " + fbErr(e) + ". Eski bağlantı çalışmaya devam ediyor.", null, 7000);
    }
  }

  /* ================= MESAİ SAATLERİ · YETKİLİ AYARLAR · WHATSAPP ŞABLONLARI ================= */
  const GUN_KISA = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
  let mesaiOverrideUntil = 0, adminUntil = 0;

  /* ---- Mesai tanımı: db.mesai = { ac, gunler:[0-6, 0=Pazar], bas:"09:00", bit:"18:00" } (tüm cihazlarda ortak) ---- */
  const mesaiOn = () => !!(db.mesai && db.mesai.ac && Array.isArray(db.mesai.gunler) && db.mesai.gunler.length);
  function isWorkday(iso) { return !mesaiOn() || db.mesai.gunler.includes(parseISO(iso).getDay()); }
  function nextWorkday(iso) { let d = iso; for (let i = 0; i < 8; i++) { d = addDays(d, 1); if (isWorkday(d)) return d; } return addDays(iso, 1); }
  function firstWorkdayOnOrAfter(iso) { return isWorkday(iso) ? iso : nextWorkday(iso); }
  const toMin = hm => { const [h, m] = String(hm || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  function isWorkTime(now) {
    now = now || new Date();
    if (!mesaiOn()) return true;
    if (!db.mesai.gunler.includes(now.getDay())) return false;
    const cur = now.getHours() * 60 + now.getMinutes();
    return cur >= toMin(db.mesai.bas) && cur < toMin(db.mesai.bit);
  }
  function mesaiOzet() {
    if (!mesaiOn()) return "";
    const order = [1, 2, 3, 4, 5, 6, 0], runs = []; let cur = [];
    order.forEach(d => { if (db.mesai.gunler.includes(d)) cur.push(d); else { if (cur.length) runs.push(cur); cur = []; } });
    if (cur.length) runs.push(cur);
    const txt = runs.map(r => r.length > 2 ? `${GUN_KISA[r[0]]}–${GUN_KISA[r[r.length - 1]]}` : r.map(d => GUN_KISA[d]).join(", ")).join(", ");
    return `${txt} · ${db.mesai.bas}–${db.mesai.bit}`;
  }
  function nextOpenText(now) {
    now = now || new Date();
    if (!mesaiOn()) return "";
    for (let i = 0; i < 8; i++) {
      const d = new Date(now.getTime()); d.setDate(d.getDate() + i);
      if (!db.mesai.gunler.includes(d.getDay())) continue;
      if (i === 0 && d.getHours() * 60 + d.getMinutes() >= toMin(db.mesai.bas)) continue;
      return `${i === 0 ? "bugün" : i === 1 ? "yarın" : GUN[d.getDay()]} ${db.mesai.bas}`;
    }
    return "";
  }
  const offChip = () => (mesaiOn() && !isWorkTime())
    ? `<div class="off-chip">🕘 Mesai dışı · tahsilat işlenemez · sonraki mesai: ${esc(nextOpenText())}</div>` : "";
  const offCls = iso => (mesaiOn() && !isWorkday(iso)) ? " off" : "";

  /* ---- Yetki PIN'i: silme ve yönetim ayarları ---- */
  /* PIN tanımlıysa yönetim ayarları yalnızca PIN'i bilen yetkili kişiye açılır (5 dk boyunca tekrar sormaz) */
  async function guardAdmin(msg) {
    if (!db.silmePin) return true;
    if (Date.now() < adminUntil) return true;
    const p = await askPin("Yetkili PIN'i", msg || "Bu ayar yalnızca yetkili kişi tarafından değiştirilebilir");
    if (p === null) return false;
    if (await verifyPin(p)) { adminUntil = Date.now() + 10 * 60000; adminPw = p; return true; }
    toast("PIN yanlış"); return false;
  }
  /* Tahsilat yalnızca mesai gün/saatinde işlenir; yetkili PIN'i mesai dışında da geçmeye izin verir */
  async function mesaiGuard() {
    if (isWorkTime() || Date.now() < mesaiOverrideUntil) return true;
    const info = `Mesai dışı: tahsilat yalnızca ${mesaiOzet()} arasında işlenebilir. Sonraki mesai: ${nextOpenText()}.`;
    if (!db.silmePin) { toast(info, null, 6500); return false; }
    const p = await askPin("Mesai dışı işlem", info + " Yetkiliyseniz PIN girin.");
    if (p === null) return false;
    if (await verifyPin(p)) { mesaiOverrideUntil = Date.now() + 10 * 60000; return true; }
    toast("PIN yanlış"); return false;
  }
  async function openMesaiSheet() {
    if (!(await guardAdmin("Mesai saatlerini yalnızca yetkili kişi değiştirebilir"))) return;
    const m = Object.assign({ ac: false, gunler: [1, 2, 3, 4, 5, 6], bas: "09:00", bit: "18:00" }, db.mesai || {});
    m.gunler = (m.gunler || []).slice();
    const order = [1, 2, 3, 4, 5, 6, 0];
    openSheet(`
      <div class="sheet-card">
        <div class="grab"></div>
        <div style="display:flex;align-items:center"><h2 style="flex:1;font-size:18px">Mesai saatleri</h2><button class="btn btn-ghost" id="sheetClose">Kapat</button></div>
        <p class="meta" style="margin:8px 0">Tanımlarsanız tahsilat yalnızca mesai gün ve saatlerinde işlenebilir (yetkili PIN'i ile mesai dışında da geçilebilir). Mesai günü olmayan günlerde tahsil edilmeyen kayıtlar <b>sonraki mesai gününe</b> otomatik devredilir (örn. Cumartesi alınmayan, Pazar kapalıysa Pazartesi'ye).</p>
        <button class="btn ${m.ac ? "btn-leather" : "btn-ghost"}" id="msAc" style="width:100%">Mesai kısıtı: <b>${m.ac ? "Açık" : "Kapalı"}</b></button>
        <label class="fld">Mesai günleri</label>
        <div class="chips" id="msDays">${order.map(d => `<button class="chip ${m.gunler.includes(d) ? "on" : ""}" data-d="${d}">${GUN_KISA[d]}</button>`).join("")}</div>
        <div class="g2">
          <div><label class="fld">Başlangıç</label><input class="inp" type="time" id="msBas" value="${m.bas}" /></div>
          <div><label class="fld">Bitiş</label><input class="inp" type="time" id="msBit" value="${m.bit}" /></div>
        </div>
        <button class="btn btn-gold" id="msSave" style="width:100%;margin-top:14px">Kaydet</button>
      </div>`);
    document.getElementById("sheetClose").onclick = closeSheet;
    document.getElementById("msAc").onclick = e => { m.ac = !m.ac; e.currentTarget.className = "btn " + (m.ac ? "btn-leather" : "btn-ghost"); e.currentTarget.innerHTML = `Mesai kısıtı: <b>${m.ac ? "Açık" : "Kapalı"}</b>`; };
    document.querySelectorAll("#msDays [data-d]").forEach(b => b.onclick = () => {
      const d = +b.dataset.d, i = m.gunler.indexOf(d);
      if (i >= 0) m.gunler.splice(i, 1); else m.gunler.push(d);
      b.classList.toggle("on", i < 0);
    });
    document.getElementById("msSave").onclick = () => {
      m.bas = document.getElementById("msBas").value || "09:00"; m.bit = document.getElementById("msBit").value || "18:00";
      if (m.ac && !m.gunler.length) return toast("En az bir mesai günü seçin");
      if (toMin(m.bit) <= toMin(m.bas)) return toast("Bitiş saati başlangıçtan sonra olmalı");
      db.mesai = { ac: m.ac, gunler: m.gunler.slice().sort((a, b) => a - b), bas: m.bas, bit: m.bit };
      save(); closeSheet(); render(); scheduleRollover(600);
      toast(m.ac ? "Mesai kaydedildi: " + mesaiOzet() : "Mesai kısıtı kapatıldı");
    };
  }

  /* ---- WhatsApp mesaj şablonları ---- */
  const WA_VARS = [["{musteri}", "Müşteri"], ["{tutar}", "Kayıt tutarı"], ["{kalan}", "Kalan tutar"], ["{vade}", "Vade"], ["{ilkvade}", "İlk vade"],
    ["{tur}", "Ödeme türü"], ["{belge}", "Çek/senet no"], ["{erteleme}", "Erteleme sayısı"], ["{bakiye}", "Toplam bakiye"], ["{firma}", "Firma"], ["{tarih}", "Bugün"], ["{kisi}", "Adınız"]];
  const DEFAULT_TPLS = [
    { id: "t1", ad: "Vade hatırlatma", m: "Merhaba {musteri}, {firma} olarak {vade} vadeli {kalan} tutarındaki {tur} ödemenizi nazikçe hatırlatmak isteriz. Teşekkür ederiz.", varsayilan: true },
    { id: "t2", ad: "Bugün vadesi geldi", m: "Merhaba {musteri}, {tarih} itibarıyla {kalan} tutarındaki ödemenizin vadesi gelmiştir. Bugün ödeme yapabilirseniz seviniriz. {firma}" },
    { id: "t3", ad: "Ertelenen ödeme bildirimi", m: "Merhaba {musteri}, {ilkvade} tarihli {kalan} tutarındaki ödemeniz {vade} tarihine ertelenmiştir. Uygun olduğunuzda ödemenizi rica ederiz. {firma}" },
    { id: "t4", ad: "Kısmi ödeme bildirimi", m: "Merhaba {musteri}, ödemeniz için teşekkür ederiz. {tutar} tutarındaki kaydınızdan kalan bakiye {kalan}, vadesi {vade}. {firma}" },
    { id: "t5", ad: "Ödeme alındı / teşekkür", m: "Merhaba {musteri}, ödemenizi aldık, teşekkür ederiz. {firma}" },
    { id: "t6", ad: "Bakiye bildirimi", m: "Merhaba {musteri}, {tarih} itibarıyla toplam açık bakiyeniz {bakiye}'dir. Bilgilerinize sunarız. {firma}" }
  ];
  const tpls = () => (Array.isArray(db.sablonlar) && db.sablonlar.length) ? db.sablonlar : DEFAULT_TPLS;
  const defaultTpl = () => tpls().find(x => x.varsayilan) || tpls()[0];
  function fillTpl(m, k) {
    const ad = (k.musteri || "").trim();
    const bakiye = round2(kayitlar().filter(x => (x.musteri || "").trim() === ad && isOpen(x)).reduce((a, x) => a + remaining(x), 0));
    const map = {
      musteri: ad, tutar: fmtTRY(k.tutar), kalan: fmtTRY(remaining(k)), vade: fmtDate(k.vade), ilkvade: fmtDate(k.orijinalVade || k.vade),
      tur: typeAd(k.tur, k), belge: k.belgeNo || "", erteleme: String(k.ertelemeSayisi || 0), bakiye: fmtTRY(bakiye),
      firma: db.magaza, tarih: fmtDate(todayISO()), kisi: ME() || ""
    };
    return String(m).replace(/\{(\w+)\}/g, (s, key) => (key in map) ? map[key] : s).replace(/[ \t]{2,}/g, " ").trim();
  }
  const SON_SABLON = "kirtasiye_son_sablon";
  function openWaPicker(id) {
    const k = kayitlar().find(x => x.id === id); if (!k) return;
    const list = tpls();
    let last = null; try { last = localStorage.getItem(SON_SABLON); } catch (e) {}
    const byStatus = isErt(k) ? list.find(x => x.id === "t3") : statusOf(k) === "kismi" ? list.find(x => x.id === "t4") : k.vade === todayISO() ? list.find(x => x.id === "t2") : null;

      <div class="sheet-card">

    document.getElementById("waGo").onclick = () => {
      const t = fmtPhone(document.getElementById("waTel").value);

  async function openTplManager() {

  const ownTpls = () => { if (!Array.isArray(db.sablonlar) || !db.sablonlar.length) db.sablonlar = DEFAULT_TPLS.map(x => ({ ...x })); return db.sablonlar; };
  function renderTplManager() {
    const list = tpls();
    openSheet(`
      <div class="sheet-card full">
        <div class="grab"></div>
        <div style="display:flex;align-items:center"><h2 style="flex:1;font-size:18px">WhatsApp şablonları</h2><button class="btn btn-ghost" id="sheetClose">Kapat</button></div>
        <p class="meta" style="margin:8px 0">Mesaj gönderirken bu şablonlardan biri seçilir. ★ varsayılan şablon, toplu hatırlatmalarda (zil ekranı) kullanılır.</p>
        ${list.map(x => `

  /* ================= YÖNETİCİ PANELİ · ÇOKLU DEFTER (ŞİFRELİ KASA) · BİLDİRİM MERKEZİ ================= */
  let adminPw = null, vaultRaw = null;
  const REG_KEY = "kirtasiye_defterlerim", PBK_ITER = 150000;
  const hasSubtle = () => !!(window.crypto && crypto.subtle && window.TextEncoder);
  const encT = s => new TextEncoder().encode(s);
  const b64e = u8 => { let s = ""; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toHex = u8 => [...u8].map(x => x.toString(16).padStart(2, "0")).join("");

  /* ---- Yönetici şifresi doğrulayıcı (PBKDF2; eski SHA-256 doğrulayıcılar da çalışır) ---- */
  async function pbkdf2Bits(pw, saltStr) {
    const base = await crypto.subtle.importKey("raw", encT(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: encT(saltStr), iterations: PBK_ITER, hash: "SHA-256" }, base, 256));
  }
  async function makeVerifier(pw) {
    const s = newToken().slice(0, 16);
    if (!hasSubtle()) return { s, h: await sha256(s + ":" + pw) };
    return { s, i: PBK_ITER, h: toHex(await pbkdf2Bits(pw, s + "|dogrula")) };
  }
  async function verifyPin(p) {
    const v = db.silmePin; if (!v) return false;
    if (v.i && hasSubtle()) return toHex(await pbkdf2Bits(p, v.s + "|dogrula")) === v.h;
    return (await sha256(v.s + ":" + p)) === v.h;
  }
  const adminActive = () => !!db.silmePin && Date.now() < adminUntil;

  /* ---- Şifreli kasa: diğer defterlerin listesi/bağlantıları yönetici şifresiyle şifrelenir (AES-GCM) ---- */
  async function vaultKeyFor(pw, salt) {
    const base = await crypto.subtle.importKey("raw", encT(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: PBK_ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function vaultSeal(pw, obj) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await vaultKeyFor(pw, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encT(JSON.stringify(obj))));
    return { v: 1, s: b64e(salt), iv: b64e(iv), ct: b64e(ct) };
  }
  async function vaultOpen(pw, blob) {
    try {
      const key = await vaultKeyFor(pw, b64d(blob.s));
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(blob.iv) }, key, b64d(blob.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (e) { return null; }
  }
  async function loadGroup() {

      const o = blob && await vaultOpen(adminPw, blob);
      if (o && Array.isArray(o.defterler)) list = o.defterler; else if (blob) bozuk = true;
    }
    if (!list.some(x => x.id === DEFTER_ID)) list.unshift(me); else list = list.map(x => x.id === DEFTER_ID ? { ...x, ad: db.magaza } : x);
    return { list, bozuk };
  }
  const dRef = (id, c, d) => fbm.doc(fbDb, "defterler", id, c, d);
  async function readGenel(id) {

  const writeGenel = (id, o) => fbm.setDoc(dRef(id, "ayar", "genel"), { d: JSON.stringify(o), u: fbm.serverTimestamp() });
  const GENEL_BOS = ad => ({ magaza: ad, firma: { tel: "", vergi: "", adres: "" }, silmePin: null, hedef: 0, mesai: null, sablonlar: null, otoErt: true });
  async function setLedgerPin(id, verifier) { const o = (await readGenel(id)) || GENEL_BOS("Defter"); o.silmePin = verifier; await writeGenel(id, o); }
  /* Grup listesini şifreleyip gruptaki HER defterin kasasına yazar; istenirse yönetici şifresini tüm defterlere uygular */
  async function writeGroup(list, pw, opts) {
    opts = opts || {};
    const raw = JSON.stringify(await vaultSeal(pw, { defterler: list, t: Date.now() }));
    const fails = [];
    for (const L of list) {
      try {
        await fbm.setDoc(dRef(L.id, "ayar", "kasa"), { d: raw, u: fbm.serverTimestamp() });
        if (opts.propagatePin && L.id !== DEFTER_ID) await setLedgerPin(L.id, db.silmePin);
      } catch (e) { fails.push(L.ad || L.id); }

  }
  function localSummary() {

  async function ledgerSummary(id) {
    const out = { id, ad: null, n: 0, bak: 0, ert: 0, bugun: 0, son: "", err: null };
    try {
      const g = await readGenel(id); if (g && g.magaza) out.ad = g.magaza;
