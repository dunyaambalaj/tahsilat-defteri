<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#142923" />
  <title>Ödeme Defteri</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --ink: #1a1612;
      --leather: #142923;
      --leather-2: #1c3b32;
      --gold: #c9a227;
      --gold-dim: #a6862a;
      --paper: #f3ead8;
      --sheet: #fff8ec;
      --line: #e4d5b8;
      --mute: #6b5e4a;
      --tahsil: #1f7a4d;
      --bekle: #1e4d8c;
      --erte: #c05612;
      --iptal: #8b2e2e;
      --kismi: #6d28d9;
      --red: #8b2e2e;
      --wa: #128c4a;
      --shadow: 0 10px 28px rgba(20, 41, 35, .16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --input: #ffffff;
      --pill: #efe4cc;
      --badge: #e7efe9;
      --ghost: #efe6d3;
      --stripe: rgba(196,168,120,.18);
    }
    /* ---------- TEMALAR ---------- */
    [data-theme="lacivert"] {
      --leather: #152238; --leather-2: #1d3050;
      --gold: #d2a83a; --gold-dim: #a5853a;
      --paper: #e8edf4; --sheet: #f8f6ef; --line: #d5dbe4;
      --input: #ffffff; --pill: #e3e8f0; --badge: #e4ebf3; --ghost: #e2e7ef;
      --stripe: rgba(140,160,190,.16);
    }
    [data-theme="kahve"] {
      --leather: #3a2718; --leather-2: #4a3320;
      --gold: #d1a33c; --gold-dim: #a5853a;
      --paper: #f0e6d3; --sheet: #fff8ec; --line: #e0d2b6;
      --input: #ffffff; --pill: #efe3c8; --badge: #efe6d2; --ghost: #ece1c9;
      --stripe: rgba(180,150,100,.18);
    }
    [data-theme="bordo"] {
      --leather: #3f1622; --leather-2: #54202f;
      --gold: #d4a73a; --gold-dim: #a5853a;
      --paper: #f5ece2; --sheet: #fff9f0; --line: #e6d7c7;
      --input: #ffffff; --pill: #f0ddcf; --badge: #f3e4da; --ghost: #eddcd0;
      --stripe: rgba(190,140,120,.16);
    }
    [data-theme="okyanus"] {
      --leather: #123b49; --leather-2: #1e5967;
      --gold: #63b9b0; --gold-dim: #378b85;
      --paper: #eaf3f3; --sheet: #fbffff; --line: #d2e2e2; --mute: #526a6c;
      --input: #ffffff; --pill: #deebeb; --badge: #e0efeb; --ghost: #e1eceb;
      --stripe: rgba(56,120,125,.13);
    }
    [data-theme="adacayi"] {
      --leather: #30483b; --leather-2: #486453;
      --gold: #b99b62; --gold-dim: #90784b;
      --paper: #edf1e8; --sheet: #fbfcf7; --line: #d8e1d3; --mute: #5e6e62;
      --input: #ffffff; --pill: #e4eadf; --badge: #e2ebe2; --ghost: #e5ebdf;
      --stripe: rgba(82,119,93,.12);
    }
    [data-theme="lavanta"] {
      --leather: #383553; --leather-2: #504a71;
      --gold: #ad95d5; --gold-dim: #7d679f;
      --paper: #f0eff8; --sheet: #fcfbff; --line: #dedceb; --mute: #68647a;
      --input: #ffffff; --pill: #e9e5f2; --badge: #e7e7f1; --ghost: #e7e5ef;
      --stripe: rgba(112,100,153,.13);
    }
    [data-theme="gul"] {
      --leather: #603b48; --leather-2: #82515e;
      --gold: #d49aa1; --gold-dim: #a96f7b;
      --paper: #f7edef; --sheet: #fff9fa; --line: #ead9de; --mute: #78636b;
      --input: #ffffff; --pill: #f0e3e7; --badge: #f0e4e9; --ghost: #f2e7e9;
      --stripe: rgba(160,92,113,.12);
    }
    [data-theme="kiremit"] {
      --leather: #5a3b32; --leather-2: #795247;
      --gold: #d3976f; --gold-dim: #ad7251;
      --paper: #f5ece5; --sheet: #fffaf6; --line: #e7d8cd; --mute: #746056;
      --input: #ffffff; --pill: #f0e4d9; --badge: #efe5dd; --ghost: #ede2d8;
      --stripe: rgba(158,104,72,.14);
    }
    [data-theme="gece"] {
      --ink: #ece7dd; --mute: #9aa5a1;
      --leather: #101a17; --leather-2: #16231f;
      --gold: #d4af3a; --gold-dim: #a5853a;
      --paper: #13181a; --sheet: #1d2425; --line: #31393a;
      --input: #232b2c; --pill: #262e2f; --badge: #223028; --ghost: #262e2f;
      --tahsil: #3bbf7a; --bekle: #6b9ae8; --erte: #e8823a; --kismi: #a06bf5; --red: #d35b5b;
      --stripe: rgba(255,255,255,.045);
      --shadow: 0 10px 28px rgba(0,0,0,.4);
    }
    /* ---------- KARANLIK MOD (tema renklerinin üstüne biner) ---------- */
    [data-mode="dark"] {
      --ink: #ece7dd; --mute: #9aa5a1;
      --paper: #101517; --sheet: #1b2224; --line: #303a3b;
      --input: #232b2d; --pill: #2a3335; --badge: #223029; --ghost: #2a3335;
      --tahsil: #3bbf7a; --bekle: #6f9fef; --erte: #ea8a45; --kismi: #a57bf7; --red: #e06666;
      --stripe: rgba(255,255,255,.04);
      --shadow: 0 10px 28px rgba(0,0,0,.45);
    }
    [data-mode="dark"] .ava { color: #e9e2cf; }
    [data-mode="dark"] .type-opt.on { background: #2a3d35; color: #f6edd8; border-color: #4f7a68; }
    [data-mode="dark"] .chip.on { background: #2a3d35; color: #f6edd8; border-color: #4f7a68; }
    [data-mode="dark"] .wk-day.on { background: #2a3d35; }
    [data-mode="dark"] .cal .d.on { background: #2a3d35; }
    [data-mode="dark"] .sheet { background: rgba(0,0,0,.66); }
    [data-mode="dark"] .card { border-color: var(--line); }
    [data-mode="dark"] .nav { background: #141a1c; }
    [data-mode="dark"] .grab { background: #4a5557; }
    [data-mode="dark"] .bar { background: #2a3335; }
    [data-mode="dark"] .search { background: var(--input); }
    [data-mode="dark"] .toast { background: #2a3d35; }
    [data-theme="gece"] .page { background: var(--paper); }
    [data-theme="gece"] .hist li::after { content: ""; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
    }
    button, input, select, textarea { font-family: inherit; font-size: 16px; }
    button { touch-action: manipulation; }
    img { max-width: 100%; }
    svg { flex: 0 0 auto; width: 20px; height: 20px; display: block; }
    .btn svg { width: 18px; height: 18px; }

    #app { height: 100%; height: 100dvh; display: flex; max-width: 1440px; margin: 0 auto; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* ---------- DERİ BAŞLIK (mobil/tablet) ---------- */
    .leather {
      background:
        radial-gradient(1200px 220px at 20% -40%, color-mix(in srgb, var(--gold) 24%, transparent), transparent 50%),
        linear-gradient(180deg, var(--leather-2) 0%, var(--leather) 100%);
      color: #f6edd8;
      padding-top: calc(var(--safe-top) + 10px);
    }
    .gold-rule {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), #ead889, var(--gold), transparent);
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid rgba(201,162,39,.55);
      display: grid; place-items: center;
      background: rgba(255,255,255,.06);
      color: var(--gold);
    }
    .hdr-ico {
      border: 1px solid rgba(201,162,39,.35);
      background: rgba(255,255,255,.08);
      color: #f6edd8; border-radius: 12px; padding: 8px 10px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* ---------- YAN RAY (PC) ---------- */
    #rail { display: none; }

    /* ---------- SAYFA ---------- */
    .page {
      flex: 1;
      overflow: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(112px + var(--safe-bot));
      background:
        repeating-linear-gradient(0deg, transparent 0 31px, var(--stripe) 31px 32px),
        linear-gradient(90deg, var(--gold) 0 7px, transparent 7px),
        var(--paper);
    }
    .page-inner { width: 100%; max-width: 720px; margin: 0 auto; min-width: 0; }

    /* ---------- BÖLÜM BAŞLIKLARI ---------- */
    .sec-title {
      font-family: Georgia, serif; font-weight: 800; font-size: 17px;
      margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .sec-title .cnt { font-family: inherit; font-size: 11px; background: var(--leather); color: #f6edd8; border-radius: 999px; padding: 2px 8px; font-weight: 700; }

    /* ---------- KAHRAMAN ---------- */
    .hero, .panel {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px 12px 10px;
      position: relative;
      min-width: 0;
    }
    .hero::after {
      content: "";
      position: absolute; right: 18px; top: -1px;
      width: 14px; height: 22px;
      background: linear-gradient(#9b1c1c, #c0392b);
      border-radius: 0 0 8px 8px;
      box-shadow: 1px 2px 0 rgba(0,0,0,.15);
    }
    .hero-big { font-family: Georgia, serif; font-weight: 800; font-size: clamp(19px, 4.6vw, 26px); line-height: 1.2; overflow-wrap: anywhere; }

    .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
    .wk-day {
      text-align: center; border-radius: 12px; padding: 6px 0 7px;
      border: 1px solid transparent; background: transparent;
      color: var(--mute); min-width: 0; font-size: 12px;
    }
    .wk-day b { display: block; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .wk-day.on { background: var(--leather); color: #f6edd8; border-color: var(--gold-dim); }
    .wk-day.on b { color: #fff; }
    .wk-day .dot { width: 5px; height: 5px; border-radius: 50%; margin: 3px auto 0; background: transparent; }
    .wk-day.has .dot { background: var(--gold-dim); }
    .wk-day.on.has .dot { background: #ead889; }

    /* ---------- ÖZET KUTULARI ---------- */
    .sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .sum {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 8px 9px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(20,41,35,.06);
      min-width: 0;
    }
    .sum .k { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum .v {
      font-weight: 750; margin-top: 3px; font-variant-numeric: tabular-nums;
      font-size: clamp(12px, 3vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sum.bek .v { color: var(--bekle); }
    .sum.tah .v { color: var(--tahsil); }
    .sum.ert .v { color: var(--erte); }

    /* ---------- ÇİPLER ---------- */
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--sheet);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--mute);
    }
    .chip.on { background: var(--leather); color: #f6edd8; border-color: var(--leather); }

    /* ---------- KAYIT KARTLARI ---------- */
    .cards { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; min-width: 0; }
    .card {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 12px 10px;
      box-shadow: 0 6px 16px rgba(20,41,35,.07);
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    .cards .card { margin-bottom: 0; }
    .card .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
    .spine.bekliyor { background: var(--bekle); }
    .spine.tahsil { background: var(--tahsil); }
    .spine.ertelendi { background: var(--erte); }
    .spine.kismi { background: var(--kismi); }
    .spine.iptal { background: #888; }
    .card.late { box-shadow: 0 0 0 1px #8b2e2e33, 0 6px 16px rgba(20,41,35,.07); }
    .late-tag {
      display: inline-block; background: var(--red); color: #fff;
      font-size: 10px; letter-spacing: .08em; font-weight: 800;
      border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: middle;
    }
    .stamp {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 800; font-size: 11px; letter-spacing: .14em;
      border: 2px solid currentColor; border-radius: 4px;
      padding: 2px 7px; transform: rotate(-13deg);
      position: absolute; right: 14px; top: 16px; opacity: .82;
      pointer-events: none;
    }
    .stamp.tahsil { color: var(--tahsil); }
    .stamp.ertelendi { color: var(--erte); }
    .stamp.kismi { color: var(--kismi); }
    .stamp.iptal { color: #777; }
    .amt { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; font-size: 17px; white-space: nowrap; }
    .amt.sub { font-size: 14px; font-weight: 700; }
    .meta { color: var(--mute); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .type-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--pill); border-radius: 999px; padding: 2px 8px;
      font-size: 11px; color: var(--ink); white-space: nowrap;
    }
    .name-row { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; padding-right: 80px; }
    .name-row.no-stamp { padding-right: 0; }

    .acts { display: flex; gap: 6px; margin-top: 10px; }
    .btn {
      border: 0; border-radius: 12px; padding: 10px 12px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      user-select: none; text-decoration: none; min-width: 0;
    }
    .btn-tahsil { background: #1f7a4d; color: #fff; flex: 1 1 0; }
    .btn-erte { background: #c05612; color: #fff; flex: 1 1 0; }
    .btn-ghost { background: var(--ghost); color: var(--ink); }
    .btn-gold { background: var(--gold); color: #1a1612; }
    .btn-leather { background: var(--leather); color: #f6edd8; }
    .btn-wa { background: var(--wa); color: #fff; }
    .btn-icon { width: 44px; padding: 10px 0; flex: 0 0 auto; }
    .btn:active { transform: scale(.98); }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* ---------- MİNİ SATIRLAR ---------- */
    .mini { display: grid; gap: 8px; }
    .mini-day {
      display: flex; align-items: baseline; gap: 8px;
      background: var(--sheet); border: 1px solid var(--line); border-radius: 12px;
      padding: 8px 10px; width: 100%; text-align: left; min-width: 0;
    }
    .mini-day .d { font-weight: 800; font-size: 13px; width: 74px; flex: 0 0 74px; color: var(--mute); }
    .mini-day .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 14px; }
    .mini-day .v { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 13px; white-space: nowrap; }

    /* ---------- FAB ---------- */
    .fab {
      flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%; border: 0;
      margin: -18px 8px 0; position: relative; z-index: 34;
      display: grid; place-items: center;
      background: radial-gradient(120% 120% at 30% 18%, rgba(255,255,255,.9), color-mix(in srgb, var(--gold) 60%, #fff) 38%, var(--gold));
      color: #1a1612; font-size: 32px; font-weight: 600; line-height: 1;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.92), inset 0 -3px 8px color-mix(in srgb, var(--gold-dim) 45%, transparent), 0 10px 24px color-mix(in srgb, var(--gold) 40%, transparent);
      cursor: pointer; transition: transform .22s cubic-bezier(.3,1.5,.5,1), box-shadow .22s;
    }
    .fab:active { transform: scale(.94); }

    /* ---------- ALT GEZİNME ---------- */
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      min-height: calc(68px + var(--safe-bot));
      background: var(--sheet); border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      padding: 7px 8px calc(8px + var(--safe-bot)); z-index: 30;
    }
    .nav-group { display: flex; align-items: center; flex: 1 1 0; min-width: 0; }
    .nav-group:first-of-type, .nav-group:last-of-type { width: calc((100% - 80px) / 2); }
    .nav-group:first-of-type { margin-right: 2px; }
    .nav-group:last-of-type { margin-left: 2px; }
    .nav button:not(.fab) {
      flex: 1 1 0; min-width: 0;
      background: none; border: 0; color: var(--mute);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 9.5px; font-weight: 700; letter-spacing: .02em; padding: 6px 1px;
    }
    .nav button.on:not(.fab) { color: var(--leather); }
    .nav svg { width: 22px; height: 22px; }

    /* ---------- ALTLIK / DİYALOG ---------- */
    .sheet {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: rgba(20, 30, 26, .55);
    }
    .sheet.show { display: block; }
    .sheet-card {
      position: absolute; left: 0; right: 0; bottom: 0;
      max-height: min(92dvh, 920px);
      background: var(--sheet);
      border-radius: 22px 22px 0 0;
      padding: 10px 16px calc(18px + var(--safe-bot));
      overflow: auto; overflow-x: hidden;
      animation: up .28s ease;
    }
    .sheet-card.full { top: calc(var(--safe-top) + 8px); max-height: none; }
    @keyframes up { from { transform: translateY(24px); opacity: .5; } }
    .grab { width: 42px; height: 5px; border-radius: 99px; background: #d7c9ad; margin: 4px auto 12px; }
    label.fld { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 12px 0 6px; font-weight: 700; }
    .inp {
      width: 100%; border: 1px solid var(--line); background: var(--input);
      border-radius: 12px; padding: 12px 12px; color: var(--ink); min-width: 0;
    }
    .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .type-opt {
      border: 1px solid var(--line); background: var(--input); border-radius: 12px;
      padding: 10px 6px; text-align: center; font-size: 12px; font-weight: 700; min-width: 0;
    }
    .type-opt.on { border-color: var(--leather); background: #e7efe9; color: var(--leather); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-width: 0; }

    /* ---------- TAKVİM ---------- */
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal .hd { text-align: center; font-size: 10px; color: var(--mute); padding: 6px 0; font-weight: 700; }
    .cal .d {
      aspect-ratio: 1; border: 0; background: var(--input); border-radius: 12px;
      font-weight: 700; color: var(--ink); position: relative; font-variant-numeric: tabular-nums; min-width: 0;
    }
    .cal .d.mute { color: #b5a78f; background: transparent; }
    .cal .d.on { background: var(--leather); color: #fff; }
    .cal .d .p { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
    .cal .d .p i { width: 4px; height: 4px; border-radius: 50%; display: block; }
    .cal .d .p i.b { background: #3b82f6; }
    .cal .d .p i.t { background: #22c55e; }
    .cal .d .p i.e { background: #f97316; }

    .bar { height: 8px; background: var(--ghost); border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 99px; }

    .hist { border-left: 2px solid var(--line); margin: 8px 0 0 8px; padding-left: 12px; }
    .hist li { font-size: 12px; color: var(--mute); margin: 0 0 8px; }

    .empty { text-align: center; padding: 28px 10px 18px; color: var(--mute); }

    .cust { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ava {
      width: 40px; height: 40px; border-radius: 14px;
      background: var(--badge); color: var(--leather); display: grid; place-items: center;
      font-weight: 800; flex: 0 0 auto;
    }
    .search {
      width: 100%; border: 1px solid var(--line); background: var(--sheet);
      border-radius: 14px; padding: 11px 12px 11px 38px;
    }
    .search-wrap { position: relative; margin-bottom: 10px; min-width: 0; }
    .search-wrap svg { position: absolute; left: 12px; top: 12px; color: var(--mute); }

    /* ---------- TOAST + GERİ AL ---------- */
    .toast {
      position: fixed; left: 50%; bottom: calc(90px + var(--safe-bot));
      transform: translateX(-50%) translateY(20px);
      background: var(--leather); color: #f6edd8; padding: 10px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; z-index: 130;
      transition: .25s ease; display: flex; align-items: center; gap: 10px; max-width: 92vw; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast button {
      background: none; border: 0; color: var(--gold); font-weight: 800;
      text-decoration: underline; padding: 4px 2px; font-size: 13px;
    }

    /* ---------- KİLİT / PIN ---------- */
    .lockwrap {
      position: fixed; inset: 0; z-index: 140;
      background:
        radial-gradient(900px 300px at 50% -10%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 55%),
        linear-gradient(180deg, var(--leather-2), var(--leather));
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .lockcard { width: min(320px, 92vw); text-align: center; color: #f6edd8; }
    .lock-title { font-size: 12px; letter-spacing: .2em; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
    .lock-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .lock-sub { font-size: 12px; color: #b9c9c0; margin-bottom: 18px; }
    .dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .dots i {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(234,216,137,.5); display: block;
    }
    .dots i.on { background: var(--gold); border-color: var(--gold); }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pad button {
      height: 56px; border-radius: 16px; font-size: 22px; font-weight: 700;
      background: rgba(255,255,255,.07); color: #f6edd8;
      border: 1px solid rgba(201,162,39,.25);
    }
    .pad button:active { background: rgba(255,255,255,.15); }
    .pad .fn { background: transparent; border-color: transparent; color: #b9c9c0; font-size: 13px; }
    .shake { animation: shk .4s; }
    @keyframes shk { 20%,60% { transform: translateX(-8px);} 40%,80% { transform: translateX(8px);} }

    .hidden { display: none !important; }
    /* İzleyici (salt okunur) görünümde düzenleme öğeleri gizlenir */
    h1,h2,h3 { margin: 0; }

    /* ---------- TABLET ---------- */
    @media (max-width: 420px) {
      .notify-row .mini-day { grid-template-columns: 44px minmax(0,1fr) auto; gap: 4px 6px; padding: 9px 8px; }
      .notify-row .mini-day .v { max-width: 84px; font-size: 11.5px; }
      .notify-wa { width: 36px; height: 38px; flex-basis: 36px; }
    }
    @media (min-width: 760px) {
      .page-inner { max-width: 940px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sum-grid { gap: 12px; }
      .mini { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .sheet-card {
        left: 50%; right: auto; bottom: 4vh; top: auto;
        transform: translateX(-50%);
        width: min(640px, 92vw);
        max-height: 88vh;
        border-radius: 22px;
        padding-bottom: 22px;
      }
      .sheet-card.full { top: auto; bottom: 4vh; max-height: 90vh; }
      @keyframes up { from { transform: translateX(-50%) translateY(24px); opacity: .5; } }
    }

    /* ---------- PC ---------- */
    @media (min-width: 1100px) {
      .page { padding: 28px 32px 148px; }
      .page-inner { max-width: 1120px; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    /* ---------- ALT MENÜ: tablet/PC'de hap biçiminde merkez bar ---------- */
    @media (min-width: 760px) {
      .page { padding-bottom: 148px; }
      .nav {
        left: 50%; right: auto; bottom: calc(14px + var(--safe-bot));
        transform: translateX(-50%); width: min(720px, 96vw); min-height: 76px;
        border: 1px solid var(--line); border-radius: 24px;
        box-shadow: 0 14px 34px rgba(15, 25, 20, .22); padding: 8px 12px;
      }
      .nav button:not(.fab) { font-size: 11px; padding: 8px 0; }
      .nav svg { width: 24px; height: 24px; }
      .nav .fab { margin-left: 12px; margin-right: 12px; }
    }
    /* ---------- BİLDİRİM ZİLİ + LOGO ---------- */
    .hdr-ico { position: relative; }
    .hwrap { max-width: 1120px; margin: 0 auto; padding: 6px 14px 10px; }
    .brandrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hbar { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .hbtn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; padding: 0; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(201,162,39,.4); background: rgba(255,255,255,.07); color: #f6edd8;
    }
    .hbtn:active { background: rgba(255,255,255,.18); }
    .hbtn svg { width: 17px; height: 17px; }
    .hbtn .bell-badge { top: -6px; right: -6px; height: 16px; min-width: 16px; font-size: 9px; }
    .bell-badge {
      position: absolute; top: -7px; right: -7px;
      background: #c0392b; color: #fff;
      font-size: 10px; font-weight: 800; line-height: 1;
      border-radius: 999px; min-width: 18px; height: 18px;
      display: grid; place-items: center; padding: 0 4px;
      border: 2px solid #1c3b32;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; display: block; }
    .theme-dot { width: 100%; height: 22px; border-radius: 7px; margin-bottom: 5px; border: 1px solid rgba(0,0,0,.12); }
    .notify-row { display: grid; grid-template-columns: minmax(0,1fr) 40px; align-items: center; gap: 6px; min-width: 0; }
    .notify-row .mini-day {
      display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center;
      gap: 4px 8px; min-height: 56px; padding: 10px; flex: 1; min-width: 0;
    }
    .notify-row .mini-day .d { width: auto; flex: none; font-size: 12px; }
    .notify-copy { display: grid; gap: 2px; min-width: 0; text-align: left; }
    .notify-row .mini-day .who {
      display: block; min-width: 0; white-space: normal; overflow: visible; text-overflow: clip;
      overflow-wrap: anywhere; font-size: 13px; font-weight: 800; line-height: 1.28;
    }
    .notify-type { color: var(--mute); font-size: 11px; line-height: 1.25; overflow-wrap: anywhere; }
    .notify-row .mini-day .v { white-space: nowrap; font-size: 12px; max-width: 100px; }
    .notify-wa { width: 40px; height: 40px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 40px; }
    .digest-list { grid-template-columns: 1fr; }
    .reminder-sheet { max-height: min(92dvh, 920px); padding-bottom: calc(20px + var(--safe-bot)); }


    /* ===== ORTAK + KLASİK ===== */
    /* Takvim ve yeni öğeler: ortak yapı + klasik (defter) görünümü. Cam görünümü bunun üstüne biner. */
    .seg { position: relative; display: flex; padding: 3px; border-radius: 12px; background: var(--pill); }
    .seg button { position: relative; z-index: 1; flex: 1; border: 0; background: transparent; color: var(--mute); font-weight: 800; font-size: 14px; padding: 8px 10px; border-radius: 10px; cursor: pointer; transition: color .3s; }
    .seg button.on { color: var(--leather); }
    .gi { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 10px; pointer-events: none; z-index: 0; background: var(--sheet); box-shadow: 0 1px 4px rgba(0,0,0,.18), 0 0 0 1px var(--line); transition: transform .5s cubic-bezier(.3,1.25,.4,1), width .5s cubic-bezier(.3,1.25,.4,1); }
    .cal-head { display: flex; align-items: center; gap: 10px; margin: 14px 0 12px; }
    .cal-title { flex: 1; min-width: 0; font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 700; overflow-wrap: anywhere; }
    .round-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--leather); font-size: 20px; line-height: 1; display: grid; place-items: center; cursor: pointer; }
    .today-btn { border: 1px solid var(--gold-dim); background: var(--gold); color: #1a1612; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 14px; }
    .kpi { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
    .kpi .k { font-size: 12px; color: var(--mute); font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .kpi .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
    .kpi .v { font-size: clamp(13px, 3.5vw, 19px); font-weight: 800; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi.pl .v { color: var(--bekle); } .kpi.th .v { color: var(--tahsil); } .kpi.er .v { color: var(--erte); } .kpi.ge .v { color: var(--red); }
    .kpi.pl .k i { background: var(--bekle); } .kpi.th .k i { background: var(--tahsil); } .kpi.er .k i { background: var(--erte); } .kpi.ge .k i { background: var(--red); }
    .m-wrap { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 12px; }
    .m-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .m-hd { text-align: center; font-size: 11px; font-weight: 800; color: var(--gold-dim); padding: 6px 0 8px; }
    .m-cell { border: 0; background: transparent; border-radius: 12px; padding: 5px 1px 6px; min-height: 54px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); min-width: 0; cursor: pointer; }
    .m-cell .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; }
    .m-cell.today .n { box-shadow: inset 0 0 0 1.5px var(--gold); font-weight: 800; }
    .m-cell.on .n { background: var(--leather); color: #f6edd8; font-weight: 800; }
    .m-cell.mute { opacity: .22; pointer-events: none; }
    .cdots { display: flex; gap: 3px; height: 7px; margin: 0; }
    .cdots i { width: 7px; height: 7px; border-radius: 50%; display: block; border: 0; }
    .cdots i.pl { background: var(--bekle); } .cdots i.th { background: var(--tahsil); } .cdots i.ge { background: var(--red); } .cdots i.er { background: var(--erte); }
    .m-cell .a1, .m-cell .a2, .m-cell .a3 { display: none; font-size: 10px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
    .m-cell .a1 { color: var(--bekle); } .m-cell .a2 { color: var(--tahsil); } .m-cell .a3 { color: var(--erte); }
    .legend { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--mute); }
    .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c); }
    .wk2 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .wk2 button { border: 0; background: transparent; border-radius: 14px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gold-dim); font-size: 11px; font-weight: 800; min-width: 0; cursor: pointer; }
    .wk2 button b { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; color: var(--ink); }
    .wk2 button.today b { box-shadow: inset 0 0 0 1.5px var(--gold); font-weight: 800; }
    .wk2 button.on b { background: var(--leather); color: #f6edd8; font-weight: 800; }
    .day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; padding: 18px 4px 8px; }
    .day-h b { white-space: nowrap; font-family: Georgia, "Times New Roman", serif; font-size: 17px; }
    .day-h b.today { color: var(--gold-dim); }
    .day-h span { font-size: 12px; color: var(--mute); text-align: right; font-weight: 700; }
    .group { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
    .row:first-child { border-top: 0; }
    .row .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 32px; color: #fff; font-size: 15px; font-weight: 800; }
    .row .ic.pl { background: var(--bekle); } .row .ic.th { background: var(--tahsil); } .row .ic.ge { background: var(--red); } .row .ic.er { background: var(--erte); }
    .row .mid { flex: 1; min-width: 0; }
    .row .t1 { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .t2 { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .v { font-weight: 800; white-space: nowrap; }
    .row .v.th { color: var(--tahsil); } .row .v.ge { color: var(--red); } .row .v.er { color: var(--erte); }
    .sub-h { font-size: 13px; font-weight: 800; color: var(--gold-dim); margin: 16px 4px 8px; display: flex; justify-content: space-between; }
    .sub-h.er { color: var(--erte); }
    .sub-h b { color: var(--ink); }
    @media (min-width: 760px) {
      .m-cell { min-height: 104px; padding-top: 8px; }
      .m-cell .a1, .m-cell .a2, .m-cell .a3 { display: block; }
      .m-cell .cdots { display: none; }
    }
    /* geçiş animasyonları */
    .vt-fwd .page-inner { animation: vtFwd .45s cubic-bezier(.2,.9,.25,1) both; }
    .vt-back .page-inner { animation: vtBack .45s cubic-bezier(.2,.9,.25,1) both; }
    .vt-fade .page-inner { animation: vtFade .35s ease both; }
    @keyframes vtFwd  { from { opacity: 0; transform: translateX(34px); } }
    @keyframes vtBack { from { opacity: 0; transform: translateX(-34px); } }
    @keyframes vtFade { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* ERTELENEN sınıfı (her iki görünümde): kehribar çerçeve + etiket */
    .ert-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
      background: color-mix(in srgb, var(--erte) 16%, transparent); color: var(--erte); }
    .card.ert { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--erte) 45%, transparent); }
    .sec-title.ert { color: var(--erte); }
    .ert-note { font-size: 12px; color: var(--mute); margin: -4px 2px 10px; }
    .card .ert-line { font-size: 12px; color: var(--erte); font-weight: 700; margin-top: 4px; }

    /* Bağlı cihazlar */
    .dev-sum { font-size: 13px; color: var(--mute); margin: 0 2px 8px; }
    .dev-sum b { color: var(--ink); }
    .dev-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--sheet); }
    .dev-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
    .dev-row:first-child { border-top: 0; }
    .dev-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; background: var(--mute); opacity: .5; }
    .dev-row.on .dev-dot { background: var(--tahsil); opacity: 1; box-shadow: 0 0 8px var(--tahsil); }
    .dev-mid { flex: 1; min-width: 0; }
    .dev-mid b { font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dev-mid > span { font-size: 12px; color: var(--mute); display: block; }
    .dev-me { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 28%, transparent); color: var(--gold-dim); margin-left: 6px; }
    .dev-del { border: 0; background: var(--ghost); color: var(--mute); font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
    .look-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* Güvenilirlik puanı */
    .stars { display: inline-block; font-size: 15px; letter-spacing: 2px; line-height: 1;
      background: linear-gradient(90deg, var(--sc, var(--gold)) var(--p), color-mix(in srgb, var(--mute) 32%, transparent) var(--p));
      -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    .score-line { margin-top: 3px; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sc-chip { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
      background: color-mix(in srgb, var(--sc) 16%, transparent); color: var(--sc); }
    .score-panel { padding: 12px 14px; margin: 0 0 12px; }
    .sc-label { font-weight: 800; font-size: 13px; color: var(--sc); padding: 4px 11px; border-radius: 999px; background: color-mix(in srgb, var(--sc) 14%, transparent); white-space: nowrap; }
    .score-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .score-facts div { background: color-mix(in srgb, var(--leather) 6%, transparent); border-radius: 12px; padding: 8px 6px; text-align: center; min-width: 0; }
    .score-facts b { display: block; font-size: 15px; font-weight: 800; }
    .score-facts span { font-size: 11px; color: var(--mute); display: block; line-height: 1.25; }
    /* Aylık hedef */
    .goal { display: block; width: 100%; text-align: left; margin: 12px 0 0; padding: 14px 16px; border-radius: 18px; background: var(--sheet); border: 1px solid var(--line); cursor: pointer; color: var(--ink); font: inherit; }
    .goal-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
    .goal-top span { font-weight: 800; color: var(--gold-dim); font-size: 19px; }
    .goal-num { font-size: clamp(18px, 5vw, 25px); margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
    .goal-num b { font-weight: 800; }
    .goalbar { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--leather) 12%, transparent); overflow: hidden; }
    .goalbar i { display: block; height: 100%; border-radius: 999px; transform-origin: left; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); animation: growX 1s cubic-bezier(.2,.9,.25,1) both; }
    .goalbar i.ok { background: linear-gradient(90deg, var(--tahsil), #5fd37f); }
    @keyframes growX { from { transform: scaleX(0); } }
    .goal-meta { font-size: 12.5px; color: var(--mute); margin-top: 6px; line-height: 1.4; }
    .goal-meta b { color: var(--ink); }
    .goal-empty { border-style: dashed; text-align: center; color: var(--mute); font-weight: 700; padding: 12px; }

    .row .t2.wrap { white-space: normal; overflow: visible; text-overflow: clip; }

    /* form: tarih kutusu taşmasın */
    .g2 > *, .row2 > * { min-width: 0; }
    .row2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    input[type="date"], input[type="time"] { min-width: 0; width: 100%; box-sizing: border-box; }
    /* mesai */
    .off-chip { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--erte); padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--erte) 14%, transparent); }
    .m-cell.off .n, .wk2 button.off b { opacity: .45; }

    /* WhatsApp şablonları */
    .wa-tpls, .wa-vars { display: flex; flex-wrap: wrap; gap: 6px; }
    .tpl-row { padding: 12px 14px; margin: 0 0 10px; }
    .tpl-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tpl-prev { margin: 6px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }

    .tpl-prev-box { padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }

    #msDays { display: flex; flex-wrap: wrap; gap: 6px; overflow: visible; }

    /* yönetici paneli · bildirim merkezi */

    .ledger-row { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--sheet); }
    .ledger-row.cur { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--gold) 55%, transparent); }
    .ledger-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
    .ledger-row .tpl-acts { margin-top: 8px; }
    .row.unread .t1::before { content: "●"; color: var(--bekle); font-size: 9px; margin-right: 6px; vertical-align: middle; }
    #btChips, .nc-chips { display: flex; flex-wrap: wrap; gap: 6px; overflow: visible; }

    /* ===== CAM (data-look=cam) ===== */
html[data-look="cam"], html[data-look="cam"][data-theme] {
      --serif: "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;

  const ID_RE = /^[A-Za-z0-9_-]{16,}$/;

  const FB_DEFAULT = {

  const TYPES = [

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const z2 = n => String(n).padStart(2, "0");
  const toISO = d => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
  const todayISO = () => toISO(new Date());
  const parseISO = s => {
    const [y,m,d] = (s || todayISO()).split("-").map(Number);
    return new Date(y, m-1, d);
  };
  const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); };
  const fmtDate = iso => { if (!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}.${m}.${y}`; };
  const fmtLong = iso => { const d = parseISO(iso); return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()} ${GUN[d.getDay()]}`; };
  const fmtTRY = n => new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0) + " ₺";
  const parseMoney = s => {
    if (typeof s === "number") return Math.round(s * 100) / 100;
    let t = String(s || "0").trim().replace(/\s/g, "").replace("₺","").replace(/TL/i,"");
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
    else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
    const n = parseFloat(t);
    return isNaN(n) ? 0 : Math.round(n * 100) / 100;
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  const typeAd = (id, k) => {

    return String(ad);

  const initials = n => (n || "?").trim().split(/\s+/).slice(0,2).map(p => p[0]).join("").toUpperCase();
  const buzz = (p=18) => { try { navigator.vibrate?.(p); } catch(e) {} };
  const round2 = n => Math.round((Number(n)||0) * 100) / 100;

  function fmtPhone(p) {
    let d = String(p || "").replace(/\D/g, "");

    if (d.length === 11 && d.startsWith("90")) d = d.slice(0);

  }

  const TEMALAR = [

      tema: "deri", karanlik: false,
      firma: { tel: "", adres: "", vergi: "", logo: "" },
      ayar: { bildirim: true, sys: false },
      sonBildirim: "",
      olusturma: new Date().toISOString()
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(cacheKey());
      if (!raw) return defaultDB();
      const d = JSON.parse(raw);
      d.kayitlar = Array.isArray(d.kayitlar) ? d.kayitlar : [];
      d.magaza = d.magaza || "Kırtasiye Toptan";
      d.tema ||= "deri";
      d.firma ||= { tel: "", adres: "", vergi: "", logo: "" };
      d.firma.tel ||= "";
      d.firma.adres ||= "";
      d.firma.vergi ||= "";
      d.firma.logo ||= "";
      d.ayar ||= { bildirim: true, sys: false };
      d.ayar.bildirim ??= true;
      d.ayar.sys ??= false;
      d.sonBildirim ||= "";
      if (d.tema === "gece") { d.tema = "deri"; d.karanlik = true; }
      d.karanlik = !!d.karanlik;
      d.kayitlar.forEach(normalizeRec);
      return d;
    } catch(e) { return defaultDB(); }
  }
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", db.tema || "deri");
    document.documentElement.setAttribute("data-mode", db.karanlik ? "dark" : "light");
    document.documentElement.setAttribute("data-look", db.gorunum === "klasik" ? "klasik" : "cam");
  }
  /* Eski/bozuk kayıtları güvenli hale getirir */
  function normalizeRec(k) {
    const LEGACY = { kart: "kart_tek", pos: "kart_tek", mahsup: "havale", diger: "nakit" };
    const valid = TYPES.some(t => t.id === k.tur);
    if (!valid) k.tur = (typeof k.tur === "string" && LEGACY[k.tur]) || "nakit";
    k.taksitSayisi = Number(k.taksitSayisi) > 1 ? Number(k.taksitSayisi) : 1;
    k.tutar = Number(k.tutar) || 0;
    k.tahsilTutar = Number(k.tahsilTutar) || 0;
    k.ertelemeGecmisi ||= [];
    k.gecmis ||= [];
    k.ertelemeSayisi ||= 0;
    k.durum ||= "bekliyor";
  }
  function save() {
    try { localStorage.setItem(cacheKey(), JSON.stringify(db)); } catch (e) {}
    finalizeUndo();
    schedulePush();
  }

  let db = load();
  let view = "ozet";
  let selectedDate = todayISO();
  let calMonth = parseISO(selectedDate);
  let filter = "tumu";
  let q = "";
  let form = null;
  let raporAralik = "ay";
  let unlockDone = false;

  /* ---------- GERİ AL ---------- */
  const NAME_KEY = "kirtasiye_kullanici";
  const ME = () => { try { return (localStorage.getItem(NAME_KEY) || "").trim(); } catch (e) { return ""; } };
  const DEV_ID = (() => {
    try { let v = localStorage.getItem("kirtasiye_cihaz"); if (!v) { v = Math.random().toString(36).slice(2, 10); localStorage.setItem("kirtasiye_cihaz", v); } return v; }
    catch (e) { return Math.random().toString(36).slice(2, 10); }
  })();
  let sheetRecId = null, myActive = null, activeTimer = null, activeByRec = new Map();

  /* Kim yaptı: değişen kayıtlara ve yeni hareket satırlarına işlemi yapanın adı yazılır */
  function stampRec(rec, bo, me, now) {
    if (!bo) rec.olusturan = rec.olusturan || me;
    rec.sonKim = me; rec.sonT = now;
    const n1 = bo ? (bo.gecmis || []).length : 0;
    (rec.gecmis || []).slice(n1).forEach(g => { if (!g.k) g.k = me; });
    const n2 = bo ? (bo.ertelemeGecmisi || []).length : 0;
    (rec.ertelemeGecmisi || []).slice(n2).forEach(g => { if (!g.k) g.k = me; });
  }
  let undoStack = [], pendingUndo = null;
  const recMap = () => new Map(db.kayitlar.map(k => [k.id, JSON.stringify(k)]));
  function pushUndo(label) { pendingUndo = { label, before: recMap() }; }
  /* save() sonrası: hangi kayıtların değiştiği bulunur, yalnızca onların eski hali saklanır */
  function finalizeUndo() {
    if (!pendingUndo) return;
    const after = recMap(), before = pendingUndo.before, touched = [];
    new Set([...before.keys(), ...after.keys()]).forEach(id => { if (before.get(id) !== after.get(id)) touched.push(id); });
    if (touched.length) {
      const me = ME() || "Bilinmiyor", now = new Date().toISOString();
      touched.forEach(id => {
        const rec = db.kayitlar.find(k => k.id === id); if (!rec) return;
        let bo = null; try { const bj = before.get(id); bo = bj ? JSON.parse(bj) : null; } catch (e) {}
        stampRec(rec, bo, me, now);
      });
      const keep = new Map(); touched.forEach(id => keep.set(id, before.get(id)));
      undoStack.push({ label: pendingUndo.label, before: keep, touched });
      if (undoStack.length > 40) undoStack.shift();
    }
    pendingUndo = null;
  }
  function undoLast() {
    if (!canWriteLedger()) return toast("Bu defterde salt görüntüleme yetkiniz var");
    const u = undoStack.pop();
    if (!u) return toast("Geri alınacak işlem yok");
    u.touched.forEach(id => {
      const b = u.before.get(id);
      const i = db.kayitlar.findIndex(k => k.id === id);
      if (b === undefined) { if (i >= 0) db.kayitlar[i].silindi = true; }
      else { const rec = JSON.parse(b); if (i >= 0) db.kayitlar[i] = rec; else db.kayitlar.push(rec); }
    });
    save(); render();
    toast("Geri alındı: " + u.label);
  }
  const UNDO = { label: "Geri al", fn: undoLast };

  /* ---------- TOAST ---------- */
  let toastTimer = null;
  function toast(msg, action, ms) {

    el.classList.add("show");
    if (action) document.getElementById("toastBtn").onclick = () => {
      clearTimeout(toastTimer); el.classList.remove("show"); action.fn();

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), ms || (action ? 6500 : 2400));
  }

  /* ---------- HESAPLAMALAR ---------- */
  function remaining(k) { return Math.max(0, round2((k.tutar || 0) - (k.tahsilTutar || 0))); }
  function statusOf(k) {
    if (k.durum === "iptal") return "iptal";
    if (remaining(k) <= 0.009) return "tahsil";
    if ((k.tahsilTutar || 0) > 0) return "kismi";
    if (k.ertelemeSayisi > 0 && k.durum !== "tahsil") return k.durum === "bekliyor" ? "ertelendi" : k.durum;
    return k.durum || "bekliyor";
  }
  function statusLabel(st) {
    return { tahsil: "TAHSİL", bekliyor: "BEKLİYOR", ertelendi: "ERTELENDİ", kismi: "KISMİ", iptal: "İPTAL" }[st] || st;
  }
  function isOpen(k) { return ["bekliyor", "ertelendi", "kismi"].includes(statusOf(k)); }
  function isLate(k) { return isOpen(k) && k.vade && k.vade < todayISO(); }
  function overdueList() {
    return kayitlar().filter(isLate).sort((a,b) => (a.vade||"").localeCompare(b.vade||"") || (a.musteri||"").localeCompare(b.musteri||"", "tr"));
  }
  function kayitlar() { return db.kayitlar.filter(k => !k.silindi); }
  function ofDate(iso) { return kayitlar().filter(k => k.vade === iso); }
  function movedFrom(iso) { return kayitlar().filter(k => (k.ertelemeGecmisi || []).some(e => e.eski === iso)); }

  function weekDates(iso) {
    const d = parseISO(iso);
    const monDiff = (d.getDay() + 6) % 7;
    const start = new Date(d); start.setDate(d.getDate() - monDiff);
    return Array.from({ length: 7 }, (_, i) => { const x = new Date(start); x.setDate(start.getDate() + i); return toISO(x); });
  }
  function dayHas(iso) {
    const list = ofDate(iso);
    return {
      b: list.some(k => isOpen(k)),
      t: list.some(k => statusOf(k) === "tahsil"),
      e: list.some(k => (k.ertelemeSayisi || 0) > 0)
    };
  }
  function sums(list) {
    let bek = 0, tah = 0, ert = 0;
    list.forEach(k => {
      const st = statusOf(k);
      if (st === "tahsil") tah += k.tutar;
      else if (st === "iptal") {}
      else {
        bek += remaining(k);
        tah += (k.tahsilTutar || 0);
        if (st === "ertelendi" || (k.ertelemeSayisi || 0) > 0) ert += remaining(k);
      }
    });
    return { bek: round2(bek), tah: round2(tah), ert: round2(ert) };
  }
  function openTotal() { return round2(kayitlar().filter(isOpen).reduce((a,k) => a + remaining(k), 0)); }

  /* ---------- GÜNLÜK BİLDİRİM ---------- */
  function digest() {
    const t = todayISO();
    const open = kayitlar().filter(isOpen);
    return {
      ert: open.filter(k => isErt(k) && k.vade <= t).sort((a,b) => (a.musteri||"").localeCompare(b.musteri||"", "tr")),
      gec: open.filter(k => !isErt(k) && k.vade < t).sort((a,b) => (a.vade||"").localeCompare(b.vade||"")),
      bug: open.filter(k => !isErt(k) && k.vade === t).sort((a,b) => (a.musteri||"").localeCompare(b.musteri||"", "tr")),
      yarin: open.filter(k => k.vade === addDays(t, 1)).sort((a,b) => (a.musteri||"").localeCompare(b.musteri||"", "tr"))
    };
  }
  function digestRow(k, wa) {
    return `<div class="notify-row">
      <button class="mini-day" data-setdate="${k.vade}">
        <span class="d">${fmtDate(k.vade).slice(0,5)}</span>
        <span class="notify-copy"><span class="who">${esc(k.musteri)}</span><span class="notify-type">${esc(typeAd(k.tur, k))}</span></span>
        <span class="v">${fmtTRY(remaining(k))}</span>
      </button>
      ${wa ? `<a class="btn btn-wa notify-wa" href="${waLink(k)}" target="_blank" rel="noopener" data-wa="1" title="WhatsApp hatırlat">${icon("msg")}</a>` : ""}
    </div>`;
  }
  function openDigest(manual) {
    const d = digest();
    const sumGroup = arr => round2(arr.reduce((a,k) => a + remaining(k), 0));
    const sec = (title, color, arr, wa) => arr.length ? `
      <div class="sec-title" style="margin-top:14px;color:${color}">${title} <span class="cnt">${arr.length}</span></div>
      <div class="meta" style="margin:-4px 0 8px">Toplam ${fmtTRY(sumGroup(arr))}</div>
      <div class="mini digest-list">${arr.map(k => digestRow(k, wa)).join("")}</div>` : "";
    openSheet(`
      <div class="sheet-card">
        <div class="grab"></div>
        <div style="display:flex;align-items:center;gap:8px">
          <h2 style="flex:1;font-size:18px">Günün hatırlatmaları</h2>
          <button class="btn btn-ghost" id="sheetClose">Kapat</button>
        </div>
        <div class="meta">${fmtLong(todayISO())}</div>
        ${sec("↻ Ertelenen tahsilatlar", "var(--erte)", d.ert, true)}
        ${sec("Geciken ödemeler", "var(--red)", d.gec, true)}
        ${sec("Bugün vadesi gelenler", "var(--bekle)", d.bug, false)}
        ${sec("Yarın vadesi gelecekler", "var(--erte)", d.yarin, false)}
        ${!d.ert.length && !d.gec.length && !d.bug.length && !d.yarin.length ? `<div class="empty">Takipte ödeme yok, her şey yolunda.</div>` : ""}
        <button class="btn btn-leather" id="digDone" style="width:100%;margin-top:14px">Bugünlük tamam</button>
      </div>`);
    document.getElementById("sheetClose").onclick = closeSheet;
    document.getElementById("digDone").onclick = () => { db.sonBildirim = todayISO(); save(); closeSheet(); };
    document.querySelectorAll("#sheet [data-setdate]").forEach(b => b.onclick = () => {
      closeSheet(); selectedDate = b.dataset.setdate; view = "defter"; render();
    });
    document.querySelectorAll("#sheet [data-wa]").forEach(a => a.addEventListener("click", e => e.stopPropagation()));
  }
  function sysNotify(d) {
    try {
      if (!db.ayar.sys) return;
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;
      new Notification(`Ödeme hatırlatması · ${db.magaza}`, {
        body: `Ertelenen ${d.ert.length} · Geciken ${d.gec.length} · Bugün ${d.bug.length} · Yarın ${d.yarin.length}`
      });
    } catch(e) {}
  }
  function maybeAutoDigest() {
    try {
      if (!db.ayar.bildirim) return;
      if (db.sonBildirim === todayISO()) return;
      const d = digest();
      db.sonBildirim = todayISO(); save();
      if (d.ert.length + d.gec.length + d.bug.length + d.yarin.length === 0) return;
      openDigest(false);
      sysNotify(d);
    } catch(e) {}
  }

  function renderOzet() {

    const buAyTahsil = round2(evAll.filter(e => e.iso.startsWith(monthPref)).reduce((a, e) => a + e.tutar, 0));
    const bugunTahsil = round2(evAll.filter(e => e.iso === t).reduce((a, e) => a + e.tutar, 0));

    const n7 = Object.values(next7).flat().length;

  function renderDefter() {

  /* ---------- TAKVİM ---------- */
  /* ---------- TAKVİM: GÜN · HAFTA · AY (planlı · ertelenen · tahsil edilen) ---------- */
  let calMode = "ay", navDir = 0;
  const fmtK = n => fmtTRY(n).replace(/,00(?= ₺)/, "");
  const GUN_UZUN = GUN;
  const kisa = n => {
    n = Number(n) || 0; if (!n) return "";
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".", ",").replace(",0", "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(".", ",").replace(",0", "") + "B";
    return String(Math.round(n));
  };
  /* Tahsilat hareketleri: yeni kayıtlarda her tahsilat sayısal olarak saklanır; eski kayıtlarda kalan tutar tahsil tarihine yazılır */
  function collectEvents(src) {
    const ev = [];
    (src || kayitlar()).forEach(k => {
      let sum = 0;
      (k.gecmis || []).forEach(g => {
        if ((g.a === "tahsil" || g.a === "kismi") && typeof g.tutar === "number") {
          ev.push({ k, iso: g.tarih || String(g.t).slice(0, 10), tutar: g.tutar, kim: g.k || "" });
          sum += g.tutar;
        }
      });
      const tot = statusOf(k) === "tahsil" ? Math.max(k.tutar || 0, k.tahsilTutar || 0) : (k.tahsilTutar || 0);
      const rest = round2(tot - sum);
      if (rest > 0.009) ev.push({ k, iso: k.tahsilTarihi || k.kayitTarihi || k.vade, tutar: rest, kim: "" });
    });
    return ev.filter(e => e.iso);
  }
  function periodTotals(from, to, events) {
    let planned = 0, ert = 0;
    kayitlar().forEach(k => {
      if (isOpen(k) && k.vade && k.vade >= from && k.vade <= to) { const r = remaining(k); if (isErt(k)) ert += r; else planned += r; }
    });
    const collected = events.filter(e => e.iso >= from && e.iso <= to).reduce((a, e) => a + e.tutar, 0);
    return { planned: round2(planned), ert: round2(ert), collected: round2(collected) };
  }
  function dayInfo(iso, events) {
    const open = ofDate(iso).filter(isOpen);
    const pl = open.filter(k => !isErt(k)), er = open.filter(isErt);
    const co = events.filter(e => e.iso === iso);
    const sum = a => round2(a.reduce((x, k) => x + remaining(k), 0));
    return { pl, er, co, plSum: sum(pl), erSum: sum(er), coSum: round2(co.reduce((a, e) => a + e.tutar, 0)), late: pl.some(isLate) };
  }
  const dotsHtml = d => `${d.pl.length ? `<i class="${d.late ? "ge" : "pl"}"></i>` : ""}${d.er.length ? `<i class="er"></i>` : ""}${d.co.length ? `<i class="th"></i>` : ""}`;
  const byName = (a, b) => (a.musteri || "").localeCompare(b.musteri || "", "tr");

  function plRow(k) {
    const late = isLate(k), st = statusOf(k);
    return `<div class="row" data-open="${k.id}">
      <div class="ic ${late ? "ge" : "pl"}">${late ? "!" : "₺"}</div>
      <div class="mid"><div class="t1">${esc(k.musteri)}</div><div class="t2">${late ? "Gecikti · " : ""}${esc(typeAd(k.tur, k))}${st === "kismi" ? " · kısmi" : ""}${k.belgeNo ? " · " + esc(k.belgeNo) : ""}</div></div>
      <div class="v ${late ? "ge" : "pl"}">${fmtTRY(remaining(k))}</div></div>`;
  }
  function erRow(k) {
    const son = (k.ertelemeGecmisi || []).slice(-1)[0] || {};
    return `<div class="row" data-open="${k.id}">
      <div class="ic er">↻</div>
      <div class="mid"><div class="t1">${esc(k.musteri)}</div><div class="t2">${k.ertelemeSayisi} kez ertelendi${son.auto ? " (otomatik)" : ""}${k.orijinalVade ? " · ilk vade " + fmtDate(k.orijinalVade).slice(0, 5) : ""}</div></div>
      <div class="v er">${fmtTRY(remaining(k))}</div></div>`;
  }
  function coRow(e) {
    return `<div class="row" data-open="${e.k.id}">
      <div class="ic th">✓</div>
      <div class="mid"><div class="t1">${esc(e.k.musteri)}</div><div class="t2">Tahsil edildi · ${esc(typeAd(e.k.tur, e.k))}${e.kim ? " · " + esc(e.kim) : ""}</div></div>
      <div class="v th">+${fmtTRY(e.tutar)}</div></div>`;
  }
  function dayDetail(iso, events, asCards) {
    const d = dayInfo(iso, events);
    const moved = movedFrom(iso).filter(k => k.vade !== iso);
    if (!d.pl.length && !d.er.length && !d.co.length && !moved.length) return `<div class="empty">Bu gün için planlı ödeme, ertelenen ya da tahsilat yok.</div>`;
    const pl = d.pl.slice().sort(byName), er = d.er.slice().sort(byName);
    return `
      ${pl.length ? `<div class="sub-h"><span>Planlı ödemeler · ${pl.length}</span><b>${fmtTRY(d.plSum)}</b></div>${asCards ? cardsGrid(pl) : `<div class="group">${pl.map(plRow).join("")}</div>`}` : ""}
      ${er.length ? `<div class="sub-h er"><span>↻ Ertelenen tahsilatlar · ${er.length}</span><b>${fmtTRY(d.erSum)}</b></div>${asCards ? cardsGrid(er) : `<div class="group">${er.map(erRow).join("")}</div>`}` : ""}
      ${d.co.length ? `<div class="sub-h"><span>Tahsil edilenler · ${d.co.length}</span><b>${fmtTRY(d.coSum)}</b></div><div class="group">${d.co.map(coRow).join("")}</div>` : ""}
      ${moved.length ? `<div class="sub-h"><span>Bu günden ertelenenler · ${moved.length}</span></div><div class="group">${moved.map(k => `<div class="row" data-open="${k.id}"><div class="ic er">→</div><div class="mid"><div class="t1">${esc(k.musteri)}</div><div class="t2">Yeni vade ${fmtDate(k.vade)}</div></div><div class="v">${fmtTRY(remaining(k))}</div></div>`).join("")}</div>` : ""}`;
  }
  function calRange() {
    if (calMode === "gun") return { from: selectedDate, to: selectedDate };
    if (calMode === "hafta") { const w = weekDates(selectedDate); return { from: w[0], to: w[6] }; }
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    return { from: `${y}-${z2(m + 1)}-01`, to: `${y}-${z2(m + 1)}-${z2(new Date(y, m + 1, 0).getDate())}` };
  }
  function calTitle() {
    if (calMode === "gun") return fmtLong(selectedDate);
    if (calMode === "hafta") {
      const w = weekDates(selectedDate), a = parseISO(w[0]), b = parseISO(w[6]);
      return a.getMonth() === b.getMonth()
        ? `${a.getDate()}–${b.getDate()} ${AY[b.getMonth()]} ${b.getFullYear()}`
        : `${a.getDate()} ${AY[a.getMonth()].slice(0, 3)} – ${b.getDate()} ${AY[b.getMonth()].slice(0, 3)} ${b.getFullYear()}`;
    }
    return `${AY[calMonth.getMonth()]} ${calMonth.getFullYear()}`;
  }

  function renderTakvim() {
    const events = collectEvents();
    const r = calRange(), tot = periodTotals(r.from, r.to, events);
    const today = todayISO();
    const head = `
      <div class="seg" role="tablist"><i class="gi"></i>
        ${[["gun", "Gün"], ["hafta", "Hafta"], ["ay", "Ay"]].map(([id, ad]) => `<button class="${calMode === id ? "on" : ""}" data-calmode="${id}" role="tab">${ad}</button>`).join("")}
      </div>
      <div class="cal-head">
        <div class="cal-title">${esc(calTitle())}</div>
        <button class="today-btn" id="calToday">Bugün</button>
        <button class="round-btn" data-calnav="-1" aria-label="Önceki">‹</button>
        <button class="round-btn" data-calnav="1" aria-label="Sonraki">›</button>
      </div>
      <div class="kpis">
        <div class="kpi pl"><div class="k"><i></i>Planlı</div><div class="v">${fmtK(tot.planned)}</div></div>
        <div class="kpi er"><div class="k"><i></i>Ertelenen</div><div class="v">${fmtK(tot.ert)}</div></div>
        <div class="kpi th"><div class="k"><i></i>Tahsil edilen</div><div class="v">${fmtK(tot.collected)}</div></div>
      </div>`;
    let body = "";
    if (calMode === "ay") {
      const y = calMonth.getFullYear(), m = calMonth.getMonth();
      const start = (new Date(y, m, 1).getDay() + 6) % 7;
      const days = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < start; i++) cells.push(null);
      for (let i = 1; i <= days; i++) cells.push(`${y}-${z2(m + 1)}-${z2(i)}`);
      while (cells.length % 7) cells.push(null);
      const sel = dayInfo(selectedDate, events);
      body = `
        <div class="m-wrap"><div class="m-grid">
          ${["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"].map(x => `<div class="m-hd">${x}</div>`).join("")}
          ${cells.map(iso => {
            if (!iso) return `<button class="m-cell mute" tabindex="-1"></button>`;
            const d = dayInfo(iso, events);
            return `<button class="m-cell ${iso === selectedDate ? "on" : ""} ${iso === today ? "today" : ""}${offCls(iso)}" data-calday="${iso}">
              <span class="n">${+iso.slice(8)}</span>
              <span class="cdots">${dotsHtml(d)}</span>
              <span class="a1">${d.plSum ? kisa(d.plSum) : ""}</span><span class="a3">${d.erSum ? "↻" + kisa(d.erSum) : ""}</span><span class="a2">${d.coSum ? "+" + kisa(d.coSum) : ""}</span>
            </button>`;
          }).join("")}
        </div>
        <div class="legend"><span style="--c:var(--bekle)">Planlı</span><span style="--c:var(--erte)">Ertelenen</span><span style="--c:var(--tahsil)">Tahsilat</span><span style="--c:var(--red)">Geciken</span></div></div>
        <div class="day-h"><b class="${selectedDate === today ? "today" : ""}">${fmtLong(selectedDate)}</b><span>${sel.pl.length} planlı · ${sel.er.length} ertelenen · ${sel.co.length} tahsilat</span></div>
        ${dayDetail(selectedDate, events, false)}`;
    } else if (calMode === "hafta") {
      const w = weekDates(selectedDate);
      body = `
        <div class="m-wrap" style="padding:8px"><div class="wk2">
          ${w.map(iso => { const d = dayInfo(iso, events), dt = parseISO(iso);
            return `<button class="${iso === selectedDate ? "on" : ""} ${iso === today ? "today" : ""}${offCls(iso)}" data-calday="${iso}">${GUN3[dt.getDay()]}<b>${dt.getDate()}</b><span class="cdots">${dotsHtml(d)}</span></button>`; }).join("")}
        </div></div>
        ${w.map(iso => { const d = dayInfo(iso, events), dt = parseISO(iso);
          const pl = d.pl.slice().sort(byName), er = d.er.slice().sort(byName);
          const parts = [d.plSum ? `Planlı ₺${kisa(d.plSum)}` : "", d.erSum ? `Ertelenen ₺${kisa(d.erSum)}` : "", d.coSum ? `Tahsil ₺${kisa(d.coSum)}` : ""].filter(Boolean);
          return `<div class="day-h"><b class="${iso === today ? "today" : ""}">${GUN_UZUN[dt.getDay()]} ${dt.getDate()} ${AY[dt.getMonth()]}</b><span>${parts.join(" · ") || "—"}</span></div>
            ${(pl.length || er.length || d.co.length) ? `<div class="group">${pl.map(plRow).join("")}${er.map(erRow).join("")}${d.co.map(coRow).join("")}</div>` : ""}`; }).join("")}`;
    } else {
      body = dayDetail(selectedDate, events, true);
    }
    return head + body;
  }

  /* ---------- MÜŞTERİ ---------- */
  function customers() {
    const map = {};
    kayitlar().forEach(k => {
      const name = (k.musteri || "").trim();
      if (!name) return;
      if (!map[name]) map[name] = { ad: name, bek: 0, tah: 0, n: 0, last: k.vade, tel: k.telefon || "" };
      map[name].n++;
      const st = statusOf(k);
      if (st === "tahsil") map[name].tah += k.tutar;
      else if (st !== "iptal") {
        map[name].bek += remaining(k);
        map[name].tah += (k.tahsilTutar || 0);
      }
      if (k.vade > map[name].last) map[name].last = k.vade;
      if (k.telefon) map[name].tel = k.telefon;
      map[name].tel ||= k.telefon || "";
    });
    return Object.values(map).sort((a,b) => b.bek - a.bek || a.ad.localeCompare(b.ad, "tr"));
  }

  function renderMusteri() {
    const list = customers();
    const totBek = round2(list.reduce((a,c) => a + c.bek, 0));
    return `
      <div class="search-wrap">
        ${icon("search")}
        <input class="search" id="qMusteri" placeholder="Müşteri ara..." value="${esc(q)}" />
      </div>
      <div class="panel" style="padding:12px;margin-bottom:12px">
        <div class="k" style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)">Açık bakiye toplamı</div>
        <div style="font-size:clamp(20px,5vw,26px);font-weight:800;color:var(--bekle);font-variant-numeric:tabular-nums">${fmtTRY(totBek)}</div>
        <div class="meta">${list.length} müşteri</div>
      </div>
      <div id="custList" class="cards">
        ${list.length ? list.map(c => `
        <article class="card" data-cust="${esc(c.ad)}">
          <div class="cust">
            <div class="ava">${esc(initials(c.ad))}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:800;overflow-wrap:anywhere">${esc(c.ad)}</div>
              <div class="meta">${c.n} kayıt · Son vade ${fmtDate(c.last)}</div>
              ${scoreLine(c.ad)}
            </div>
            <div style="text-align:right;flex:0 0 auto">
              <div class="amt" style="font-size:15px;color:${c.bek?"var(--bekle)":"var(--tahsil)"}">${fmtTRY(c.bek)}</div>
              <div class="meta">tahsil ${fmtTRY(c.tah)}</div>
            </div>
          </div>
        </article>`).join("") : `<div class="empty">Müşteri bulunamadı.</div>`}
      </div>
    `;
  }

  /* ---------- RAPOR ---------- */
  function rangeFilter(kind) {
    const t = todayISO();
    if (kind === "bugun") return k => k.vade === t;
    if (kind === "hafta") { const wk = weekDates(t); return k => k.vade >= wk[0] && k.vade <= wk[6]; }
    if (kind === "ay") { const p = t.slice(0,7); return k => (k.vade || "").startsWith(p); }
    return () => true;
  }
  function raporTitle() {
    return raporAralik === "bugun" ? fmtLong(todayISO()) : raporAralik === "hafta" ? "Bu hafta" : raporAralik === "ay" ? `${AY[new Date().getMonth()]} ${new Date().getFullYear()}` : "Tüm kayıtlar";
  }

  function renderRapor() {
    const list = kayitlar().filter(rangeFilter(raporAralik));
    const s = sums(list);
    const byType = {};
    TYPES.forEach(t => byType[t.id] = { tah: 0, bek: 0 });
    list.forEach(k => {
      if (!byType[k.tur]) byType[k.tur] = { tah: 0, bek: 0 };
      const st = statusOf(k);
      if (st === "tahsil") byType[k.tur].tah += k.tutar;
      else if (st !== "iptal") {
        byType[k.tur].bek += remaining(k);
        byType[k.tur].tah += (k.tahsilTutar || 0);
      }
    });
    const max = Math.max(1, ...Object.values(byType).map(x => x.tah + x.bek));
    return `
      <div class="chips">
        ${[["bugun","Bugün"],["hafta","Bu hafta"],["ay","Bu ay"],["tumu","Tümü"]].map(([id,ad]) => `<button class="chip ${raporAralik===id?"on":""}" data-rapor="${id}">${ad}</button>`).join("")}
      </div>
      <div class="hero" style="margin-bottom:12px">
        <div style="font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:700">GÖRSEL RAPOR</div>
        <div class="hero-big" style="font-size:clamp(16px,4vw,22px)">${esc(raporTitle())}</div>
        <div class="sum-grid" style="margin:12px 0 0">
          <div class="sum bek"><div class="k">Bekleyen</div><div class="v">${fmtK(s.bek)}</div></div>
          <div class="sum tah"><div class="k">Tahsil</div><div class="v">${fmtK(s.tah)}</div></div>
          <div class="sum ert"><div class="k">Ertelenen</div><div class="v">${fmtK(s.ert)}</div></div>
        </div>
      </div>
      <div class="panel card" style="padding:12px">
        <div style="font-weight:800;margin-bottom:10px">Ödeme türüne göre</div>
        ${TYPES.map(t => {
          const x = byType[t.id];
          if (!x.tah && !x.bek) return "";
          return `<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px;min-width:0">
              <b style="white-space:nowrap">${t.ad}</b><span class="meta">${fmtTRY(x.tah)} tahsil · ${fmtTRY(x.bek)} açık</span>
            </div>
            <div class="bar"><span style="width:${((x.tah+x.bek)/max)*100}%;background:linear-gradient(90deg,#1f7a4d,#c9a227)"></span></div>
          </div>`;
        }).join("") || `<div class="meta">Kayıt yok.</div>`}
      </div>
      <div class="g2" style="margin-top:12px">
        <button class="btn btn-leather" id="btnShareDay">Günün fişi</button>
        <button class="btn btn-gold" id="btnShareRange">Dönem görseli</button>
      </div>
    `;
  }

  /* ---------- RENDER + BAĞLANTI ---------- */
  let lastSegIdx = -1;
  /* Cam merceğin (seçili sekme göstergesi) bir konumdan diğerine kayarak geçmesi */
  function placeInd(box, prev, idx) {
    const gi = box && box.querySelector(".gi"); if (!gi) return;
    const btns = [...box.querySelectorAll("button")];
    const at = i => { const b = btns[i]; return b ? { x: b.offsetLeft, w: b.offsetWidth } : null; };
    const inset = box.classList.contains("seg") ? 0 : 3;
    const fix = o => o && { x: o.x + inset, w: o.w - inset * 2 };
    const to = fix(at(idx)); if (!to || to.w <= 0) return;
    const from = fix(prev >= 0 && at(prev)) || to;
    gi.style.transition = "none"; gi.style.width = from.w + "px"; gi.style.transform = `translateX(${from.x}px)`;
    void gi.offsetWidth;
    gi.style.transition = ""; gi.style.width = to.w + "px"; gi.style.transform = `translateX(${to.x}px)`;
  }
  window.addEventListener("resize", () => {
    const vi = VIEWS.findIndex(v => v[0] === view);
    placeInd(document.querySelector(".nav"), vi, vi); placeInd(document.querySelector(".tb-nav"), vi, vi);
    const sg = document.querySelector(".seg"); if (sg) { const si = ["gun", "hafta", "ay"].indexOf(calMode); placeInd(sg, si, si); }
  });
  function header() { return db.gorunum === "klasik" ? headerKlasik() : headerCam(); }
  const BASLIK = { ozet: "Özet", defter: "Defter", takvim: "Takvim", musteri: "Müşteriler", rapor: "Rapor" };
  let lastViewIdx = -1, lastCalMode = "";
  function render() {
    if (leaving) return;
    renderTick++;
    let body = "";
    if (view === "ozet") body = renderOzet();
    else if (view === "defter") body = renderDefter();
    else if (view === "takvim") body = renderTakvim();
    else if (view === "musteri") body = renderMusteri();
    else body = renderRapor();
    /* Geçiş animasyonu yalnızca menü/mod/tarih aralığı değişince oynar (canlı güncellemelerde titremez) */
    const vi = VIEWS.findIndex(v => v[0] === view);
    const modeKey = view === "takvim" ? calMode : "";
    let cls = "";
    if (lastViewIdx !== -1 && (vi !== lastViewIdx || modeKey !== lastCalMode)) cls = vi > lastViewIdx ? "vt-fwd" : vi < lastViewIdx ? "vt-back" : "vt-fade";
    else if (navDir) cls = navDir > 0 ? "vt-fwd" : "vt-back";
    const viewChanged = lastViewIdx !== -1 && vi !== lastViewIdx;
    const prevVi = lastViewIdx;
    lastViewIdx = vi; lastCalMode = modeKey; navDir = 0;
    const subs = { ozet: "", defter: "Günlük kayıtlar", takvim: "Planlı ödemeler ve tahsilatlar", musteri: "", rapor: "" };
    document.getElementById("app").innerHTML =
      `<div id="main" class="${cls}">${header()}<main class="page"><div class="page-inner">${db.gorunum === "klasik" ? "" : `<div class="lt"><h1>${BASLIK[view] || ""}</h1>${subs[view] ? `<p>${subs[view]}</p>` : ""}</div>`}${body}</div></main></div>${nav()}`;
    if (viewChanged) { const pg = document.querySelector(".page"); if (pg) pg.scrollTop = 0; }
    bind();
    placeInd(document.querySelector(".nav"), prevVi, vi);
    placeInd(document.querySelector(".tb-nav"), prevVi, vi);
    const segEl = document.querySelector(".seg");
    if (segEl) { const si = ["gun", "hafta", "ay"].indexOf(calMode); placeInd(segEl, lastSegIdx, si); lastSegIdx = si; } else lastSegIdx = -1;
  }

  function bind() {
    document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
    document.getElementById("btnSettings")?.addEventListener("click", openSettings);
    document.getElementById("btnThemeToggle")?.addEventListener("click", () => {
      db.karanlik = !db.karanlik;
      save();
      applyTheme();
      render();
      toast(db.karanlik ? "Karanlık mod açık" : "Aydınlık mod açık");
    });
    document.getElementById("btnBell")?.addEventListener("click", openNotifCenter);
    document.getElementById("btnShareTop")?.addEventListener("click", () => openShare(selectedDate, ofDate(selectedDate), fmtLong(selectedDate)));
    document.getElementById("fab")?.addEventListener("click", () => canWriteLedger() ? openForm() : toast("Bu defterde salt görüntüleme yetkiniz var"));
    document.getElementById("goalOpen")?.addEventListener("click", openGoalSheet);
    document.getElementById("actAll")?.addEventListener("click", openActivity);
    const pgEl = document.querySelector(".page"), tbEl = document.querySelector(".topbar");
    if (pgEl && tbEl) { const f = () => tbEl.classList.toggle("scrolled", pgEl.scrollTop > 6); pgEl.addEventListener("scroll", f, { passive: true }); f(); }
    document.querySelectorAll("[data-calmode]").forEach(b => b.onclick = () => {
      if (b.dataset.calmode === calMode) return;
      calMode = b.dataset.calmode; calMonth = parseISO(selectedDate); render();
    });
    document.querySelectorAll("[data-calnav]").forEach(b => b.onclick = () => {
      const st = parseInt(b.dataset.calnav, 10); navDir = st;
      if (calMode === "gun") selectedDate = addDays(selectedDate, st);
      else if (calMode === "hafta") selectedDate = addDays(selectedDate, 7 * st);
      else {
        const sel = parseISO(selectedDate);
        const first = new Date(calMonth.getFullYear(), calMonth.getMonth() + st, 1);
        const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
        selectedDate = toISO(new Date(first.getFullYear(), first.getMonth(), Math.min(sel.getDate(), last)));
      }
      calMonth = parseISO(selectedDate); render();
    });
    document.querySelectorAll("[data-calday]").forEach(b => b.onclick = () => { selectedDate = b.dataset.calday; calMonth = parseISO(selectedDate); render(); });
    document.getElementById("calToday")?.addEventListener("click", () => {
      const t = todayISO(); navDir = t > selectedDate ? 1 : t < selectedDate ? -1 : 0;
      selectedDate = t; calMonth = parseISO(t); render();
    });
    document.getElementById("prevDay")?.addEventListener("click", () => { selectedDate = addDays(selectedDate, -1); render(); });
    document.getElementById("nextDay")?.addEventListener("click", () => { selectedDate = addDays(selectedDate, 1); render(); });
    document.getElementById("btnToday")?.addEventListener("click", () => { selectedDate = todayISO(); render(); });
    document.getElementById("btnPick")?.addEventListener("click", () => {
      const d = document.getElementById("datePick");
      d.focus();
      if (d.showPicker) { try { d.showPicker(); } catch(e) { d.click(); } } else d.click();
    });
    document.getElementById("datePick")?.addEventListener("change", e => { selectedDate = e.target.value; render(); });
    document.querySelectorAll("[data-setdate]").forEach(b => b.onclick = () => { selectedDate = b.dataset.setdate; view = "defter"; render(); });
    document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
    document.querySelectorAll("[data-rapor]").forEach(b => b.onclick = () => { raporAralik = b.dataset.rapor; render(); });
    document.getElementById("prevMonth")?.addEventListener("click", () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); render(); });
    document.getElementById("nextMonth")?.addEventListener("click", () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); render(); });
    document.getElementById("qMusteri")?.addEventListener("input", e => {
      q = e.target.value;
      const needle = q.toLocaleLowerCase("tr");
      document.querySelectorAll("#custList [data-cust]").forEach(card => {
        card.style.display = (!needle || (card.dataset.cust || "").toLocaleLowerCase("tr").includes(needle)) ? "" : "none";
      });

  /* ---------- ANLIK BİNLER BASAMAĞI FORMATLAMA ---------- */
  function liveMask(val) {
    let clean = val.replace(/[^\d,]/g, "");
    let parts = clean.split(",");
    if (parts.length > 2) clean = parts[0] + "," + parts.slice(1).join("");
    let ip = parts[0];
    let dp = parts[1];
    if (ip) {
      ip = ip.replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    } else if (clean.startsWith(",")) {
      ip = "0";
    }
    return dp !== undefined ? ip + "," + dp.slice(0, 2) : ip;
  }

    };

  /* ---------- PIN ---------- */
  function hashPin(p) {
    let h = 5381;
    for (let i = 0; i < p.length; i++) h = ((h * 33) ^ p.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
